<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Arcade</title>
<link rel="stylesheet" href="shared/arcade.css">
<script src="shared/games.js"></script>
<script src="shared/profile.js"></script>
<script src="shared/pixel.js"></script>
<style>
/* ===== THE ARCADE HUB: the hall is one pixel canvas behind everything (wall, floor, lamps, window, props), drawn to fit
   the page; the marquee and each cabinet are their own pixel canvases in the page, so they stay real, focusable buttons.
   Every canvas shows its art at the same whole number of device pixels per art pixel. ===== */
html,body{min-height:100%}
body{position:relative;overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;background:#0c0709}
#hall{position:absolute;left:0;top:0;z-index:0;pointer-events:none}
.bar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;padding:12px 16px}
.who{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 12px}
.who-i{display:block;width:28px;height:28px}
.who-n{max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--gold);text-shadow:1px 1px 0 #000}
html[data-theme=light] .who-n{text-shadow:none}
.who .px-btn,.bar-r .px-btn{min-height:34px;padding:3px 10px 2px;font-size:var(--fs-s);font-family:'Waystone Small','Waystone',monospace}
.bar-r{display:flex;align-items:center;gap:12px}
.last{color:#d8cdb8;text-shadow:1px 1px 0 #000;text-align:right}
main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;padding:4px 16px 18px}
#marquee{display:block;margin:2px auto 0}
.cabs{display:flex;justify-content:center;align-items:flex-end;margin-top:auto}
.cab{position:relative;display:block;padding:0;border:0;background:none;cursor:pointer;line-height:0;-webkit-tap-highlight-color:transparent}
.cab canvas{display:block}
.cab:focus-visible{outline:none}
.cab:focus-visible::after{content:'';position:absolute;left:-8px;right:-8px;bottom:-10px;height:4px;background:var(--gold);box-shadow:0 0 0 2px #000}
.cab.lit{filter:drop-shadow(0 0 14px var(--glow))}
html.rm .cab.lit{filter:none}
.info{width:min(660px,100%);margin-top:18px}
.info-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 6px}
.info-t{font-size:calc(var(--fs) + 3px);color:var(--gold);text-shadow:1px 1px 0 #000}
html[data-theme=light] .info-t{text-shadow:none}
.info-b{margin:0 0 6px}
.info-p{margin:0 0 10px;color:#9fd36a;text-shadow:1px 1px 0 #000}
html[data-theme=light] .info-p{color:#3a6a20;text-shadow:none}
.info-p:empty{display:none}
.info-a{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.hint{color:var(--mute)}
.toast{position:fixed;left:50%;bottom:22px;z-index:60;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;width:min(520px,calc(100% - 32px));pointer-events:none}
.toast div{padding:10px 14px;color:#e6e3da;background:#1c1d24;text-shadow:1px 1px 0 #000;box-shadow:inset 2px 2px 0 #30323b,inset -2px -2px 0 #0a0b0f,0 0 0 2px #050608;animation:tin .18s steps(3)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
body.leave main,body.leave .bar{transition:opacity .35s steps(5);opacity:0}
.soon-a{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:14px}
@media (max-width:560px){.bar{padding:10px 12px}.last{display:none}.info{margin-top:14px}.info-a .hint{display:none}}
@media (max-width:560px),(pointer:coarse){#play .px-k{display:none}}
</style>
</head><body>
<canvas id="hall" class="px" aria-hidden="true"></canvas>
<header class="bar">
 <div class="who px-panel"><canvas class="who-i px" id="whoi" aria-hidden="true"></canvas><span class="who-n" id="pname">Player One</span><button class="px-btn" id="pedit" type="button">Edit name</button></div>
 <div class="bar-r"><span class="last px-small" id="plast"></span><button class="px-btn" id="bset" type="button">Settings</button></div>
</header>
<main>
 <h1 class="sr-only" id="aname">The Arcade</h1>
 <canvas id="marquee" class="px" aria-hidden="true"></canvas>
 <div class="cabs" id="cabs" role="group" aria-label="Games"></div>
 <section class="info px-panel" id="info" aria-live="polite"></section>
</main>
<div class="px-dialog" id="dset" role="dialog" aria-modal="true" aria-labelledby="dset-h" hidden><div class="px-panel">
 <h2 class="px-h" id="dset-h">Settings</h2>
 <p class="px-small px-mute" style="margin:0 0 8px">Shared by every game in the arcade. Each game keeps its own save.</p>
 <div id="dset-b"></div>
 <div class="px-actions"><button class="px-btn go" type="button" data-close>Done</button></div>
</div></div>
<div class="px-dialog" id="dname" role="dialog" aria-modal="true" aria-labelledby="dname-h" hidden><div class="px-panel">
 <h2 class="px-h" id="dname-h">Your name</h2>
 <label class="px-small px-mute" for="nin">The name the arcade greets you by (up to 20 letters).</label>
 <input class="px-input" id="nin" maxlength="20" autocomplete="nickname" style="margin-top:8px">
 <div class="px-actions"><button class="px-btn" type="button" data-close>Cancel</button><button class="px-btn go" type="button" id="nsave">Save</button></div>
</div></div>
<div class="px-dialog" id="dsoon" role="dialog" aria-modal="true" aria-labelledby="dsoon-h" hidden><div class="px-panel">
 <h2 class="px-h" id="dsoon-h">Coming soon</h2>
 <p id="dsoon-b" style="margin:0"></p>
 <div class="soon-a"><button class="px-btn" type="button" id="speek">Take a peek</button><button class="px-btn go" type="button" data-close>Back to the hall</button></div>
</div></div>
<div class="toast" id="toast" aria-live="polite"></div>
<script>
(()=>{'use strict';
const A=window.Arcade,CFG=A.config,GAMES=CFG.games,$=s=>document.querySelector(s),R=document.documentElement;
const T0=performance.now(),now=()=>(performance.now()-T0)/1000;
let K=2,sel=0,lastPtr='mouse';

/* ---------- the profile: seeded once from DialBound's own save, so the first visit never flips a choice made there ---------- */
function seed(){if(A.profile.exists())return;let s={};try{const D=JSON.parse(localStorage.getItem('longroad_v1'));if(D&&typeof D==='object'){const t=D.set||{};
 s={music:!!D.mus,sfx:!!D.snd,motion:['sys','on','off'].includes(t.rm)?t.rm:'sys',theme:['sys','dark','light'].includes(t.th)?t.th:'sys'}}}catch(e){}
 A.profile.seed({settings:s})}
seed();
const mqM=matchMedia('(prefers-reduced-motion: reduce)'),mqT=matchMedia('(prefers-color-scheme: light)');
const RM=()=>A.settings.motionReduced();
function applyLook(){R.dataset.theme=A.settings.theme();R.classList.toggle('rm',RM())}
applyLook();try{mqM.addEventListener('change',()=>{applyLook();draw(true)});mqT.addEventListener('change',applyLook)}catch(e){}

/* ---------- a game's progress, read safely from its own save (only DialBound has one yet). Anything odd: nothing shown ---------- */
const TITLES=[[1,'Wanderer'],[5,'Scout'],[10,'Pathfinder'],[15,'Warden'],[20,'Captain'],[30,'Lantern-Bearer'],[40,'Keeper of the Citadel'],[50,'Lord of the Long Road']];
const p2=n=>String(n).padStart(2,'0'),dayK=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const prevWD=ds=>{const d=new Date(ds+'T12:00:00');do{d.setDate(d.getDate()-1)}while(d.getDay()===0||d.getDay()===6);return dayK(d.getTime())};
const PROGRESS={dialbound(){const S=JSON.parse(localStorage.getItem('longroad_v1'));if(!S||typeof S!=='object'||S.cls==null)return '';
 let xp=0;(Array.isArray(S.ev)?S.ev:[]).forEach(e=>{xp+=+e.x||0});const ad=o=>{if(o&&o.x)for(const k in o.x)xp+=+o.x[k]||0};Object.values(S.days||{}).forEach(ad);ad(S.old);xp+=S.bxp|0;
 if(!isFinite(xp)||xp<0)return '';let L=1,n=xp;while(n>=250+50*L&&L<500){n-=250+50*L;L++}
 const td=dayK(Date.now()),last=typeof S.last==='string'?S.last:'',sh=Array.isArray(S.tal)&&S.tal.includes('a1'),on=!!last&&(last>=prevWD(td)||(sh&&last>=prevWD(prevWD(td)))),st=on?S.streak|0:0;
 return 'Level '+L+' '+TITLES.filter(t=>L>=t[0]).pop()[1]+' · '+(st?st+'-day streak':'no streak running')}};
const progress=g=>{try{return PROGRESS[g.id]?PROGRESS[g.id]():''}catch(e){return ''}};

/* ---------- sound: synthesised (no files), a soft hum under Music and blips under Sound effects, both at the master volume ---------- */
const SND=(()=>{let ac=null,hum=null;const S=()=>A.profile.get().settings;
 function ctx(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(ac.state==='suspended')ac.resume().catch(()=>{});return ac}
 function humSet(){const s=S(),want=s.music&&s.volume>0;if(!ac)return;
  if(want&&!hum){const n=ac.sampleRate*2,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.2}
   const src=ac.createBufferSource();src.buffer=b;src.loop=true;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=150;const g=ac.createGain();g.gain.value=0;
   const o1=ac.createOscillator(),o2=ac.createOscillator(),g1=ac.createGain(),g2=ac.createGain();o1.frequency.value=60;o2.frequency.value=120;g1.gain.value=.18;g2.gain.value=.08;
   const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.13;lg.gain.value=.12;lfo.connect(lg);lg.connect(g.gain);
   src.connect(lp);lp.connect(g);o1.connect(g1);g1.connect(g);o2.connect(g2);g2.connect(g);g.connect(ac.destination);[src,o1,o2,lfo].forEach(x=>x.start());hum={g,parts:[src,o1,o2,lfo]}}
  if(hum){const v=want?.32*s.volume:0;hum.g.gain.setTargetAtTime(v,ac.currentTime,.6);if(!want){const h=hum;hum=null;setTimeout(()=>{try{h.parts.forEach(x=>x.stop());h.g.disconnect()}catch(e){}},2500)}}}
 function tone(type,f0,f1,t0,dur,vol){const s=S();if(!s.sfx||!s.volume)return;const c=ctx();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;
  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur*.8);g.gain.setValueAtTime(vol*s.volume,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02)}
 return{wake(){if(ctx())humSet()},humSet,blip(){tone('square',880,1320,0,.07,.04)},coin(){tone('square',988,0,0,.08,.05);tone('square',1319,0,.08,.32,.05)},bonk(){tone('triangle',230,140,0,.18,.09)}}})();
['pointerdown','keydown'].forEach(t=>addEventListener(t,()=>SND.wake(),{capture:true,passive:true}));

/* ---------- the lettering and colour of the hall ---------- */
const GOLD=['#fff6c8','#ffe384','#f6c650','#e0a535','#c98a24','#9a5a10'];
// DialBound's gilded logo, made as the game makes its own: its blackletter face thresholded to hard pixels and gold-shaded
let LOGO=null;
function dbLogo(){if(LOGO)return LOGO;const ok=document.fonts&&document.fonts.check('12px "Jacquard 12"');
 if(!ok)return Px.text('DIALBOUND',{face:'slab',ramp:GOLD,ink:'#1a0d02'});
 const[c,g]=Px.canvas(90,18);g.font='12px "Jacquard 12"';g.fillStyle='#000';g.fillText('DialBound',3,13);const D=g.getImageData(0,0,90,18).data,M=(x,y)=>x>=0&&y>=0&&x<90&&y<18&&D[(y*90+x)*4+3]>110;
 let x0=90,x1=0,y0=18,y1=0;for(let y=0;y<18;y++)for(let x=0;x<90;x++)if(M(x,y)){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
 const[o,og]=Px.canvas(x1-x0+3,y1-y0+3),G=['#fff6c8','#ffe384','#f6c650','#e0a535','#c98a24','#e8b440','#b07018'];
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(!M(x,y))continue;const t=(y-y0)/Math.max(1,y1-y0);og.fillStyle=!M(x,y-1)?'#fffbe0':!M(x,y+1)?'#7a4a0c':G[Math.min(6,Math.floor(t*7))];og.fillRect(x-x0+1,y-y0+1,1,1)}
 return LOGO=Px.outline(o,'#1a0d02','#000000')}

/* ---------- the cabinets: 96x168 art pixels, a little three-quarter turned (the right side shows) ---------- */
const CW=96,CH=168,SCR={x:13,y:37,w:64,h:50};
const PAL={
 dialbound:{body:['#0c1320','#142037','#1c2d4c','#263c63','#33507e'],side:['#080d17','#0e1626','#152036'],trim:'#c9ad5c',trimHi:'#ffe384',panel:['#1a2232','#252f44','#333f58','#4a5874'],glow:'#7fc8ff',
  marq:['#080c1c','#101a34','#1a2a50'],btn:['#e0503a','#f0c04a','#5ad0e0'],stick:'#e0503a',slot:'#ff9a3a'},
 leadslinger:{body:['#2a1206','#43200d','#5e3015','#7c431f','#9c5a2a'],side:['#1c0c04','#2a1408','#3a1d0c'],trim:'#e8d0a0',trimHi:'#fff4d8',panel:['#2e1c10','#43301c','#5a4228','#7a5c38'],glow:'#ffb050',
  marq:['#3a1606','#5a2408','#7a3410'],btn:['#e0503a','#f0c04a','#7ad070'],stick:'#2a2622',slot:'#ffcf6a'},
 _:{body:['#18181e','#22232b','#2e2f39','#3c3e4a','#4e505e'],side:['#101015','#16161c','#1e1e26'],trim:'#a1a1a0',trimHi:'#e6e3da',panel:['#22232b','#2e2f39','#3c3e4a','#4e505e'],glow:'#c8c0ff',
  marq:['#101018','#1a1a26','#262638'],btn:['#e0503a','#f0c04a','#5ad0e0'],stick:'#e0503a',slot:'#ff9a3a'}};
const pal=g=>PAL[g.id]||PAL._;
const rect=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
// the cabinet body (cached, lit and unlit): marquee box, bezel, control panel, coin door, kick plate, the side panel
const BASE={};
function cabBase(G,lit){const k=G.id+(lit?1:0);if(BASE[k])return BASE[k];const P=pal(G),[c,g]=Px.canvas(CW,CH),B=P.body,D=P.side;
 // the side panel, seen past the front's right edge, a little foreshortened
 for(let y=4;y<164;y++){const s=y<30?2:y<92?1:y<112?0:1;rect(g,86,y,6-s,1,y%9===0?D[0]:D[1]);rect(g,86,y,1,1,D[2])}
 rect(g,86,3,4,1,D[2]);rect(g,88,96,4,14,P.panel[0]);
 // the front: top cap, body, its lit left edge and shaded right edge
 rect(g,4,2,82,3,B[0]);rect(g,4,5,82,159,B[2]);for(let y=5;y<164;y++){rect(g,4,y,2,1,B[3]);rect(g,84,y,2,1,B[1])}
 for(let y=6;y<164;y+=1)for(let x=6;x<84;x++)if(Px.hash(x,y)>.93)rect(g,x,y,1,1,B[(x+y)%7?1:3]);// a faint grain in the paint
 // T-molding down both front edges, a bright line in the cabinet's trim colour
 for(let y=5;y<164;y++){rect(g,4,y,1,1,lit?P.trimHi:P.trim);rect(g,85,y,1,1,P.trim)}
 // the marquee box
 rect(g,6,5,78,25,B[0]);rect(g,7,6,76,23,P.trim);rect(g,8,7,74,21,B[0]);
 // the speaker grille
 rect(g,10,30,70,3,B[1]);for(let x=12;x<78;x+=3)rect(g,x,31,2,1,B[0]);
 // the bezel and the dark glass of the CRT, corners rounded
 rect(g,9,33,72,58,'#06070c');rect(g,10,34,70,56,'#10121a');
 [[13,37],[76,37],[13,86],[76,86]].forEach(([x,y])=>rect(g,x,y,1,1,'#10121a'));
 // the control panel, jutting forward: a lit top that slopes toward the player, a darker front face
 for(let y=91;y<102;y++){const o=Math.round((y-91)*.4);rect(g,4-o,y,82+o*2,1,y===91?P.panel[3]:P.panel[2])}
 rect(g,0,102,90,8,P.panel[1]);rect(g,0,102,90,1,P.panel[3]);rect(g,0,109,90,1,P.panel[0]);
 // the stick (a ball top on a shaft) and three buttons
 rect(g,22,94,2,5,'#2a2a30');rect(g,20,91,6,4,P.stick);rect(g,21,91,2,1,'#ffffff');rect(g,20,99,6,2,'#14151a');
 P.btn.forEach((col,i)=>{const x=44+i*11;rect(g,x,96,7,3,'#14151a');rect(g,x+1,95,5,3,col);rect(g,x+2,95,2,1,'#ffffff')});
 // the lower body: a recessed front, the coin door with its two slots, a lock, a vent
 rect(g,8,111,74,46,B[1]);rect(g,8,111,74,1,B[0]);
 rect(g,31,118,28,30,'#4a4c56');rect(g,32,119,26,28,'#6a6c76');rect(g,32,119,26,1,'#9a9ca6');rect(g,32,146,26,1,'#2a2b31');
 rect(g,35,121,20,6,'#2a2b31');{const t=Px.text('COIN',{face:'tiny',ramp:[lit?'#ffe08a':'#b8a070']});g.drawImage(t,45-Math.round(t.width/2),122)}
 [37,47].forEach(x=>{rect(g,x,129,6,9,'#3a3b42');rect(g,x+1,130,4,7,lit?P.slot:Px.mix(P.slot,'#14151a',.5));rect(g,x+2,131,2,5,'#14151a');rect(g,x+2,131,1,5,lit?'#fff4d8':Px.mix(P.slot,'#14151a',.3))});// two coin entries, lit
 [37,47].forEach(x=>{rect(g,x,140,6,4,'#14151a');rect(g,x,140,6,1,'#9a9ca6')});// the coin-return flaps
 // the kick plate and the feet
 rect(g,4,157,82,7,'#16171c');rect(g,4,157,82,1,'#3a3b42');rect(g,8,164,8,3,'#0a0a0e');rect(g,74,164,8,3,'#0a0a0e');
 // the marquee's own art, backlit
 marquee(G,g,lit);
 return BASE[k]=Px.outline(c,'#07060a')}
function marquee(G,g,lit){const P=pal(G),M=P.marq,x0=8,y0=7,w=74,h=21;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const t=y/h,v=t*2.2+Px.dith(x,y)*.8+(lit?-.5:0);rect(g,x0+x,y0+y,1,1,M[Math.max(0,Math.min(2,Math.floor(2-v)))])}
 if(G.id==='dialbound'){for(let i=0;i<14;i++){const x=x0+2+Math.floor(Px.hash(i,7)*(w-4)),y=y0+1+Math.floor(Px.hash(i,8)*(h-3));rect(g,x,y,1,1,lit?'#dfe8ff':'#6a7aa8')}
  const L=dbLogo();g.globalAlpha=lit?1:.82;g.drawImage(L,x0+Math.round((w-L.width)/2),y0+Math.round((h-L.height)/2));g.globalAlpha=1}
 else if(G.id==='leadslinger'){const ramp=lit?['#fff4d8','#ffe08a','#ffb04a','#e07a2a']:['#d8c8a8','#c8a060','#a87838','#8a5a26'];
  const a=Px.text('COMING',{face:'slab',ramp,ink:'#2a0c04'}),b=Px.text('SOON',{face:'slab',ramp,ink:'#2a0c04'});
  g.drawImage(a,x0+Math.round((w-a.width)/2),y0+1);g.drawImage(b,x0+Math.round((w-b.width)/2),y0+11)}
 else{const t=Px.text(G.title.slice(0,14),{face:'tiny',ramp:['#e6e3da'],ink:'#000000'});g.drawImage(t,x0+Math.round((w-t.width)/2),y0+Math.round((h-t.height)/2))}}

/* ---------- the attract screens, 64x50, redrawn every frame ---------- */
const SPR={
 hero:[['..R..','.RRR.','.RFR.','.RRR.','RRRRR','.R.R.','.K.K.'],['..R..','.RRR.','.RFR.','.RRR.','RRRRR','..RR.','..KK.']],
 pine:['..g..','.ggg.','.ggg.','ggggg','..t..'],
 weed:[['..wWw..','.wW.Ww.','wW.w.Ww','w.wWw.w','wW.w.Ww','.wW.Ww.','..wWw..'],['..wwW..','.Ww.wW.','ww.Ww.w','W.w.wWw','w.Ww.ww','.wW.wW.','..Www..']],
 cactus:['...g...','...g...','g..g...','g..g..g','ggggg.g','...gggg','...g...','...g...']};
const SP={},WD={};const weed=f=>WD[f]||(WD[f]=Px.sprite(SPR.weed[f],{w:'#b8864a',W:'#ecc888'},'#3a1a08'));const spr=(k,f,pl)=>{const key=k+f+JSON.stringify(pl);if(SP[key])return SP[key];const R=f==null?SPR[k]:SPR[k][f],[c,g]=Px.canvas(R[0].length,R.length);

 if(!rm)H.lamps.forEach((l,i)=>{for(let k=0;k<5;k++){const p=(t*.06+k*.2+i*.1)%1,x=l.x+Math.round(Math.sin(t*.7+k*2.1+i)*(4+p*18)),y=l.y+6+Math.round(p*(H.L.floor-l.y-10));g.fillStyle='rgba(255,236,190,.55)';g.fillRect(x,y,1,1)}});
 Px.show(H.cv,H.frame,K)}

/* ---------- drawing everything at one pixel size, and the loop (still when motion is reduced) ---------- */
function cabDraw(C,i,t){const lit=i===sel,g=C.ag;g.clearRect(0,0,CW,CH);g.drawImage(cabBase(C.G,lit),0,0);
 (SCREENS[C.G.id]||((g2,tt)=>screenGen(g2,tt,C.G)))(C.sg,t,C.G);crt(C.sg,lit);g.drawImage(C.sc,SCR.x,SCR.y);
 if(lit&&!RM()){g.globalCompositeOperation='lighter';g.globalAlpha=.12+.04*Math.sin(t*3);g.drawImage(C.sc,SCR.x,SCR.y);g.globalAlpha=1;g.globalCompositeOperation='source-over'}
 C.b.classList.toggle('lit',lit);Px.show(C.cv,C.art,K)}
function sizeUp(){const d=devicePixelRatio||1,vw=innerWidth,vh=innerHeight,bar=$('.bar').offsetHeight,info=Math.max(140,$('#info').offsetHeight),
 byW=Math.floor((vw-32)*d/(CW*2+28)),byH=Math.floor((vh-bar-info-70)*d/(CH+46));K=Math.max(1,Math.min(byW,byH,Math.floor(6*d)));
 // each cabinet's gap, a whole number of art pixels too
 $('#cabs').style.gap=(28*K/d)+'px';mqBake()}
let raf=0,last=0;
function draw(force){const t=RM()?0:now();CABS.forEach((C,i)=>cabDraw(C,i,t));mqDraw(t);hallDraw(t)}
let lastH=0;
function loop(ms){raf=requestAnimationFrame(loop);if(RM())return;if(ms-last<66)return;last=ms;const t=now();CABS.forEach((C,i)=>cabDraw(C,i,t));
 if(ms-lastH>=125){lastH=ms;mqDraw(t);hallDraw(t)}}
function relayout(){infoFit();sizeUp();CABS.forEach((C,i)=>cabDraw(C,i,0));mqDraw(0);requestAnimationFrame(()=>{hallBake();draw(true)})}

/* ---------- choosing and playing ---------- */
const info=$('#info');
function infoHTML(i){const G=GAMES[i],pr=G.status==='ready'?progress(G):'';
 return '<div class="info-h"><span class="info-t">'+esc(G.title)+'</span><span class="px-small px-mute">'+esc(G.sub||'')+'</span></div><p class="info-b">'+esc(G.blurb||'')+'</p><p class="info-p">'+esc(pr)+'</p>'
  +'<div class="info-a">'+(G.status==='ready'?'<button class="px-btn go" type="button" id="play">Play '+esc(G.title)+' <span class="px-k">Enter</span></button>':'<button class="px-btn" type="button" id="play">Coming soon</button>')
  +'<span class="hint px-small">Left and Right to choose a cabinet</span></div>'}
function showInfo(){info.innerHTML=infoHTML(sel);$('#play').onclick=()=>play(sel)}
// the panel keeps the height of its longest game, so choosing another never moves the cabinets off their rug
function infoFit(){info.style.minHeight='';let m=0;GAMES.forEach((G,i)=>{info.innerHTML=infoHTML(i);m=Math.max(m,info.offsetHeight)});info.style.minHeight=m+'px';showInfo()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function choose(i,sound){i=(i+GAMES.length)%GAMES.length;if(i===sel&&info.innerHTML)return;sel=i;showInfo();if(sound)SND.blip();if(RM())draw(true)}
function play(i){const G=GAMES[i];if(G.status!=='ready'){SND.bonk();soonOpen(G);return}
 try{A.played(G.id)}catch(e){}SND.coin();document.body.classList.add('leave');setTimeout(()=>{location.href=G.path},RM()?60:380)}
CABS.forEach((C,i)=>{C.b.addEventListener('pointerdown',e=>{lastPtr=e.pointerType||'mouse'});C.b.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')choose(i,true)});C.b.addEventListener('focus',()=>choose(i,false));
 C.b.addEventListener('click',()=>{if(lastPtr==='touch'&&sel!==i){choose(i,true);lastPtr='mouse';return}lastPtr='mouse';choose(i,false);play(i)})});
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3200)}

/* ---------- dialogs: settings, the name, coming soon ---------- */
let openD=null,backTo=null;
function dOpen(id,focus){dClose();openD=$(id);backTo=document.activeElement;openD.hidden=false;setTimeout(()=>{try{(focus?$(focus):openD.querySelector('button,input')).focus()}catch(e){}},0)}
function dClose(){if(!openD)return;openD.hidden=true;openD=null;try{backTo&&backTo.focus()}catch(e){}}
document.querySelectorAll('.px-dialog').forEach(d=>{d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-close]'))dClose()})});
// Tab stays inside an open dialog
addEventListener('keydown',e=>{if(!openD||e.key!=='Tab')return;const F=[...openD.querySelectorAll('button,input')].filter(x=>!x.disabled&&x.offsetParent);if(!F.length)return;const a=F[0],b=F[F.length-1];
 if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}});
const SETS=[['music','Music','Soft arcade hum here, the score in each game',[[true,'On'],[false,'Off']]],['sfx','Sound effects','Blips and coins here, deed sounds in each game',[[true,'On'],[false,'Off']]],
 ['volume','Master volume','',null],['motion','Reduced motion','No flicker, chasing bulbs or moving screens',[['sys','Match system'],['on','On'],['off','Off']]],['theme','Theme','Panels and dialogs',[['sys','Match system'],['dark','Dark'],['light','Light']]]];
function setView(){const s=A.profile.get().settings;$('#dset-b').innerHTML=SETS.map(([k,n,d,o])=>'<div class="px-row"><div><div>'+n+'</div>'+(d?'<div class="px-small px-mute">'+d+'</div>':'')+'</div>'
 +(o?'<div class="px-seg" role="group" aria-label="'+n+'">'+o.map(([v,l])=>'<button type="button" class="px-btn'+(s[k]===v?' on':'')+'" aria-pressed="'+(s[k]===v)+'" data-k="'+k+'" data-v="'+v+'">'+l+'</button>').join('')+'</div>'
  :'<div class="px-seg"><input class="px-range" type="range" min="0" max="100" step="5" value="'+Math.round(s.volume*100)+'" id="vol" aria-label="Master volume"><span class="px-small" id="volv" style="min-width:42px;text-align:right">'+Math.round(s.volume*100)+'%</span></div>')+'</div>').join('')}
$('#dset-b').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k,raw=b.dataset.v,v=raw==='true'?true:raw==='false'?false:raw;A.settings.set(k,v);setView();SND.blip();try{$('#dset-b [data-k="'+k+'"][data-v="'+raw+'"]').focus()}catch(x){}});
$('#dset-b').addEventListener('input',e=>{if(e.target.id!=='vol')return;const v=+e.target.value/100;A.settings.set('volume',v);$('#volv').textContent=Math.round(v*100)+'%'});
$('#bset').onclick=()=>{setView();dOpen('#dset')};
function nameView(){const p=A.profile.get();$('#pname').textContent=p.name;const L=p.last,G=L&&GAMES.find(g=>g.id===L.game);$('#plast').textContent=G?'Last played: '+G.title+', '+ago(L.at):''}
function ago(t){const d=Math.floor((new Date().setHours(0,0,0,0)-new Date(t).setHours(0,0,0,0))/864e5);return d<=0?'today':d===1?'yesterday':d+' days ago'}
$('#pedit').onclick=()=>{$('#nin').value=A.profile.get().name;dOpen('#dname','#nin');setTimeout(()=>{try{$('#nin').select()}catch(e){}},10)};
const nameSave=()=>{A.profile.set({name:$('#nin').value});dClose();toast('Welcome to '+CFG.name+', '+A.profile.get().name+'.')};
$('#nsave').onclick=nameSave;$('#nin').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nameSave()}});
let soonG=null;function soonOpen(G){soonG=G;$('#dsoon-b').textContent=G.title+' is on its way. '+(G.blurb||'');dOpen('#dsoon')}
$('#speek').onclick=()=>{if(soonG){location.href=soonG.path}};
A.onChange(()=>{applyLook();nameView();SND.humSet();if(!openD||openD.id!=='dset')return;});
// the player's little coin badge beside their name
(()=>{const s=Px.sprite(['..yyy..','.yYYYy.','yYyYyYy','yYYyYYy','yYyYyYy','.yYYYy.','..yyy..'],{y:'#b07818',Y:'#f0c04a'},'#2a1806','#000000');Px.show($('#whoi'),s,Math.max(1,Math.round(3*(devicePixelRatio||1)*28/30/3)))})();

/* ---------- keys and controllers ---------- */
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;if(openD){if(e.key==='Escape'){e.preventDefault();dClose()}return}
 if(e.target&&e.target.tagName==='INPUT')return;const k=e.key;
 if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();choose(sel+(k==='ArrowLeft'?-1:1),true);CABS[sel].b.focus({preventScroll:true})}
 else if(k==='Enter'&&!(e.target&&e.target.closest&&e.target.closest('button'))){e.preventDefault();play(sel)}});
// the Gamepad API: d-pad or left stick to choose, A or Start to play, B to close a dialog (each press counted once)
const pad={l:0,r:0,a:0,b:0,t:0};
function padPoll(){const P=navigator.getGamepads?[...navigator.getGamepads()].filter(Boolean):[];if(!P.length)return;const p=P[0],B=i=>!!(p.buttons[i]&&p.buttons[i].pressed),ax=p.axes[0]||0;
 const l=B(14)||ax<-.55,r=B(15)||ax>.55,a=B(0)||B(9),b=B(1),n=performance.now();
 if((l&&!pad.l)||(l&&n-pad.t>420)){if(!openD){choose(sel-1,true);CABS[sel].b.focus({preventScroll:true})}pad.t=n}
 if((r&&!pad.r)||(r&&n-pad.t>420)){if(!openD){choose(sel+1,true);CABS[sel].b.focus({preventScroll:true})}pad.t=n}
 if(a&&!pad.a){if(openD){const f=document.activeElement;if(f&&openD.contains(f))f.click()}else play(sel)}if(b&&!pad.b)dClose();Object.assign(pad,{l,r,a,b})}
(function pl(){padPoll();requestAnimationFrame(pl)})();

/* ---------- start: the name, the arcade's name, the last game played chosen ---------- */
document.title=CFG.name;$('#aname').textContent=CFG.name;$('#marquee').setAttribute('aria-label',CFG.name);nameView();
{const L=A.profile.get().last,i=L?GAMES.findIndex(g=>g.id===L.game):-1;sel=i>=0?i:0}showInfo();
relayout();raf=requestAnimationFrame(loop);
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(relayout,80)});
// the marquee's blackletter face may arrive after the first frame: draw DialBound's logo again once it has
try{document.fonts.load('12px "Jacquard 12"').then(()=>{LOGO=null;for(const k in BASE)delete BASE[k];draw(true)})}catch(e){}
try{document.fonts.ready.then(()=>relayout())}catch(e){}
})();
</script>
</body></html>
