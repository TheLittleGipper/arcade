<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DialBound</title>
<link href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Jacquard+24&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e1cb;--card:#f3efdd;--ink:#1f2a22;--mute:#5d6a5c;--gold:#9a6a12;--acc:#a8381f;--ok:#2f6b3a;--line:#bdb78f;--bar:#d3cda8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1612;--card:#15231c;--ink:#e9e4cc;--mute:#93a38f;--gold:#e8b44c;--acc:#e0714a;--ok:#86c876;--line:#27392e;--bar:#1f3027}}
:root[data-theme="dark"]{--bg:#0d1612;--card:#15231c;--ink:#e9e4cc;--mute:#93a38f;--gold:#e8b44c;--acc:#e0714a;--ok:#86c876;--line:#27392e;--bar:#1f3027}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 100px}
h1,.hd{font-family:Cinzel,Georgia,serif}
h1{margin:0;font-size:26px;letter-spacing:.5px;color:var(--gold)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mute{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.bar{height:12px;background:var(--bar);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#f3cf72);transition:width .4s}
.bar.boss i{background:linear-gradient(90deg,var(--acc),#f08a5c)}
.stats{display:flex;justify-content:space-between;margin-top:8px;font-size:calc(14px*var(--ts,1))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.grid button{min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;font:inherit;cursor:pointer;touch-action:manipulation;transition:transform .08s}
.grid button:active{transform:scale(.95);border-color:var(--gold)}
.grid .i{font-size:28px;line-height:1}.grid b{font-size:15px}.grid small{color:var(--mute)}
.mini,.wide{font:inherit;background:var(--bar);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.wide{width:100%;padding:10px;font-weight:bold}
.wide.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.path{position:relative}
.wp{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--mute)}
.wp span.r{color:var(--gold);font-weight:bold}
.q{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line);font-size:15px}
.q:first-of-type{border-top:0}
.q.done{color:var(--ok)}
.lg{font-size:calc(14px*var(--ts,1));display:flex;justify-content:space-between;padding:3px 0}
#toast{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 14px}
#toast div{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:calc(14px*var(--ts,1));text-align:center;max-width:440px;animation:pop .25s}
#toast div.big{background:var(--gold);color:#1a1405;font-weight:bold}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
footer{text-align:center;margin-top:14px}

h1{font:16px/1.3 Cinzel,serif;color:var(--gold);text-shadow:2px 2px 0 #1a120b}
.hd,.mini,.wide,.stats,#toast div,.grid button,#rg{font-family:Cinzel,serif}
.hd{font-size:10px;line-height:1.5}.stats{font-size:8px}.mini{font-size:8px;border-width:3px;padding:6px}.wide{font-size:9px}
.card,.wide,.mini,.grid button{border:4px solid #1a120b;border-radius:0;box-shadow:inset 0 0 0 2px var(--gold),4px 4px 0 #1a120b}
.mini{border-width:3px}
.bar{border-radius:0;height:14px;border:2px solid #1a120b}
.bar i{background:repeating-linear-gradient(90deg,transparent 0 6px,#0004 6px 8px),var(--gold);transition:width .4s steps(8)}
.bar.boss i{background:repeating-linear-gradient(90deg,transparent 0 6px,#0004 6px 8px),var(--acc)}
.grid{grid-template-columns:repeat(3,1fr)}
.grid button{min-height:72px;font-size:7px;line-height:1.4;padding:4px 2px}
.grid b,.grid small{font-size:7px}.grid .i{font-size:22px}
.grid button:active,.wide:active{transform:translate(3px,3px);box-shadow:inset 0 0 0 2px var(--gold),1px 1px 0 #1a120b}
#scw{margin:0 3px 14px;border:4px solid #1a120b;box-shadow:0 0 0 3px var(--gold),5px 5px 0 3px #1a120b;background:#1a120b}
#rg{font-size:9px;color:var(--gold);padding:8px;line-height:1.4}
#cv{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated}
#toast div{border-radius:0;font-size:9px;line-height:1.5;border:3px solid #1a120b}
.q,.lg{font-size:13px}
.cp #scw{display:none}.cp .wrap{max-width:340px}

#ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}#ov[hidden]{display:none}
.mod{width:100%;max-width:440px;max-height:85vh;overflow:auto;background:var(--card);border:4px solid #1a120b;box-shadow:inset 0 0 0 2px var(--gold),0 0 0 3px var(--gold);padding:14px}
.tabs{display:flex;gap:8px;margin:8px 0}.mini.on{background:var(--gold);color:#1a1405}.mini:disabled{opacity:.4;cursor:default}
.eqs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0}
.eqs button{font:7px/1.5 Cinzel,serif;min-height:64px;background:var(--bar);color:var(--ink);border:3px solid #1a120b;border-radius:0;padding:2px;cursor:pointer}
.it{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.it .nm{flex:1;min-width:130px;font-weight:bold;text-shadow:1px 1px 0 #1a120b}

#scw{position:relative}#ch{position:absolute;right:6px;top:5px;z-index:2}
.ic{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;font-size:18px;background:var(--bar);border:3px solid var(--line);outline:2px solid #1a120b}
.ic.big{width:64px;height:64px;font-size:38px;margin-bottom:10px}
.drop{text-align:center;border:4px solid;padding:16px;margin-bottom:12px;background:var(--bar);animation:pop .3s;line-height:1.6}
.cst{font-size:72px;text-align:center;animation:shk .5s infinite alternate}
@keyframes shk{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}

body{font:19px/1.25 'EB Garamond',serif}
.mini{font-size:10px}.mute{font-size:17px}.q,.lg,.it{font-size:19px}.stats{font-size:9px}
.gi{image-rendering:pixelated;display:block}
.ic{width:38px;height:38px;font-size:0}.ic.big{width:66px;height:66px}
.mod{max-width:600px}
.eqs button{font:9px/1.5 Cinzel,serif}
.hp{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}.hp .nm{flex:1}
.tt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.tb{display:flex;flex-direction:column;align-items:center}
.tn{width:100%;text-align:center;padding:8px 4px;background:var(--bar);border:3px solid var(--line);color:var(--ink);font:inherit;font-size:17px;line-height:1.1;cursor:pointer}
.tn b{display:block;font:9px/1.4 Cinzel,serif;margin-bottom:4px}
.tn.un{background:var(--gold);color:#1a1405;border-color:#1a120b}.tn.av{border-color:var(--gold)}.tn.lk{opacity:.45;cursor:default}
.ln{width:4px;height:14px;background:var(--line)}.ln.on{background:var(--gold)}
.hb{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.grid .i{display:flex}

html,body{overflow:hidden;height:100%}body{background:#0d0b1a}
#cv{position:fixed!important;left:0;top:0;width:100vw!important;height:100vh!important;max-height:none!important;margin:0!important;z-index:1;display:block;image-rendering:pixelated;aspect-ratio:auto!important}
.cp #cv,.cp #side{display:none}
.wrap{position:fixed!important;inset:0;max-width:none!important;padding:0!important;margin:0!important;z-index:10;pointer-events:none;display:grid!important;grid-template-columns:minmax(0,350px) 1fr minmax(0,370px)!important;grid-template-rows:auto auto 1fr auto!important;column-gap:10px!important;align-items:start!important}
.wrap>*{pointer-events:auto;grid-column:auto!important;grid-row:auto!important}
.wrap>header{grid-column:1/-1!important;grid-row:1!important;margin:0!important;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:color-mix(in srgb,#0d0b1a 82%,transparent);border-bottom:4px solid #1a120b;box-shadow:0 3px 0 var(--gold)}
.wrap>section.card{grid-column:1!important;grid-row:2!important;margin:10px 0 0 10px!important;background:color-mix(in srgb,var(--card) 90%,transparent)}
#scw{grid-column:2!important;grid-row:2!important;justify-self:center;margin:10px 0 0!important;text-align:center;position:static!important;border:0!important;box-shadow:none!important;background:none!important;pointer-events:none}
#rg{display:inline-block;padding:6px 10px;border:3px solid #1a120b;background:color-mix(in srgb,#0d0b1a 78%,transparent)}
#ch{position:fixed;bottom:16px;left:16px;top:auto;right:auto;z-index:50;margin:0;pointer-events:auto}#ch[hidden]{display:none!important}@media(max-width:899px){#ch{bottom:200px}}
:where(html.nrw) #ch{bottom:200px}
#side{grid-column:3!important;grid-row:2/4!important;justify-self:end;width:100%;max-height:calc(100vh - 210px);overflow-y:auto;margin:10px 10px 0 0!important}
#side .card{background:color-mix(in srgb,var(--card) 90%,transparent)}
.nosp #side{display:none}
#btns{grid-column:1/-1!important;grid-row:4!important;align-self:end;justify-self:center;display:grid!important;grid-template-columns:repeat(8,minmax(0,112px))!important;justify-content:center;gap:8px;margin:0!important;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));width:100%}
#btns button{background:color-mix(in srgb,var(--card) 90%,transparent)}
#ov{z-index:30}#toast{z-index:40}
@media(max-width:899px){.wrap{grid-template-columns:1fr!important}.wrap>section.card{grid-row:3!important;align-self:end;margin:0 8px 4px!important}#scw{grid-column:1!important;grid-row:2!important}#side{position:fixed;left:8px;right:8px;bottom:190px;top:auto;max-height:40vh;width:auto;margin:0!important;background:color-mix(in srgb,#0d0b1a 94%,transparent);padding:6px}#btns{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:6px}#btns button{min-height:58px}}
:where(html.nrw) .wrap{grid-template-columns:1fr!important}:where(html.nrw) .wrap>section.card{grid-row:3!important;align-self:end;margin:0 8px 4px!important}:where(html.nrw) #scw{grid-column:1!important;grid-row:2!important}:where(html.nrw) #side{position:fixed;left:8px;right:8px;bottom:190px;top:auto;max-height:40vh;width:auto;margin:0!important;background:color-mix(in srgb,#0d0b1a 94%,transparent);padding:6px}:where(html.nrw) #btns{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:6px}:where(html.nrw) #btns button{min-height:58px}

:root{--hud:var(--gold)}
body[data-ph="focus"]{--hud:#ff7a2a}body[data-ph="short"]{--hud:#4fb3d9}body[data-ph="long"]{--hud:#55d6a0}
.wrap>header{box-shadow:0 3px 0 var(--hud)!important}
.wrap>section.card,#side .card{box-shadow:inset 0 0 0 2px var(--hud),4px 4px 0 #1a120b!important}
#pb{background:repeating-linear-gradient(90deg,transparent 0 6px,#0004 6px 8px),var(--hud)!important}
#fxv{position:fixed;inset:0;z-index:2;pointer-events:none}
body[data-ph="focus"] #fxv{box-shadow:inset 0 0 70px 6px rgba(255,90,20,.38);animation:flk 1.4s steps(5) infinite alternate}
body[data-ph="short"] #fxv,body[data-ph="long"] #fxv{box-shadow:inset 0 0 90px 8px rgba(60,170,210,.3),inset 0 0 40px rgba(80,220,150,.18);animation:calm 4s ease-in-out infinite alternate}
@keyframes flk{from{opacity:.6}to{opacity:1}}@keyframes calm{from{opacity:.7}to{opacity:1}}
.pcfg select{font:inherit;background:var(--bar);color:var(--ink);border:3px solid #1a120b;border-radius:0;padding:1px 2px}

#wm{position:fixed;left:0;right:0;top:64px;bottom:120px;z-index:25;display:flex;flex-direction:column;background:color-mix(in srgb,#0d0b1a 90%,transparent);border-top:4px solid #1a120b;border-bottom:4px solid #1a120b;box-shadow:inset 0 0 0 2px var(--gold);color:var(--ink)}
#wm[hidden]{display:none}
#wmh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px}
#wmb{flex:1;min-height:0;display:flex;gap:10px;padding:0 12px 10px}
#wmg{flex:1;min-width:0;height:100%;shape-rendering:crispEdges;background:rgba(0,0,0,.28);border:3px solid #1a120b}
#wmp{width:300px;overflow:auto;font-size:19px;background:color-mix(in srgb,var(--card) 92%,transparent);border:3px solid #1a120b;padding:10px}
body.wmv .wrap>section.card,body.wmv #side,body.wmv #scw{display:none}
.ed{stroke:#6b5a45;stroke-width:1;stroke-dasharray:2 2}.ed.on{stroke:#ffd23f;stroke-dasharray:none}
.nd{cursor:pointer}.nd rect{stroke:#1a120b;stroke-width:1.2}
.nd.o rect{fill:#478E3E}.nd.p rect{fill:#9b51e0}.nd.r rect{fill:#4fb3d9}.nd.g rect{fill:#a8692b}.nd.b rect{fill:#E6223B}
.nd.clr rect{fill:#ffd23f}.nd.lck{opacity:.35}.nd.act rect{stroke:#fff;stroke-width:1.6;animation:wmp 1s steps(2) infinite}.nd.sel rect{stroke:var(--gold);stroke-width:1.8}
.nd text{font:3.2px Cinzel,serif;fill:#fff;text-anchor:middle;pointer-events:none}.nd.clr text{fill:#1a120b}.nd text.lb{font-size:2.4px;fill:#e9e4cc}
@keyframes wmp{from{stroke-width:1.2}to{stroke-width:2.2}}
#mq{display:block;margin-top:6px;padding:5px 9px;border:3px solid #1a120b;background:color-mix(in srgb,#0d0b1a 78%,transparent);font:8px/1.5 Cinzel,serif;color:#fff}
@media(max-width:899px){#wmb{flex-direction:column}#wmp{width:auto;max-height:42%}}
:where(html.nrw) #wmb{flex-direction:column}:where(html.nrw) #wmp{width:auto;max-height:42%}
#ch{font-size:11px;padding:10px 14px;background:#ffd23f;color:#1a1405;border-color:#1a120b;animation:chp .8s steps(2) infinite alternate}@keyframes chp{from{transform:translateY(0)}to{transform:translateY(-4px)}}
#btns button[data-k="article"]{border-color:#7a1f2b}#btns button[data-k="article"]:hover{background:color-mix(in srgb,#8a1428 32%,var(--card));border-color:#c0283f}

/* ===== MOSSY RUIN STONE THEME: moonlit gray granite slabs reclaimed by moss; gothic pixel lettering cut into the stone ===== */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#0a0d0b;--card:#898989;--line:#45474e;--gold:#6a4a06;--acc:#6e1410;--ink:#15161a;--mute:#25272c;--bar:#1d1e22;--ok:#1d4a1f;
 --fh:'Jacquard 12',monospace;--fb:'Jacquard 12',monospace;--fl:'Jacquard 24','Jacquard 12',monospace;
 --s0:#141519;--s1:#2c2e34;--s2:#45474e;--s3:#5d5f65;--s4:#747579;--s5:#898989;--s6:#a1a1a0;--s7:#bdbcb8;--s8:#d6d4ce;
 --moss:#38523d;--lichen:#6e8f5c;--rune:#9fd36a;--moss-ink:#173019;--num:#4a0c0c;
 --cut:1px 1px 0 rgba(214,212,206,.6);--cut-deep:1px 1px 0 rgba(214,212,206,.6),-1px -1px 0 rgba(20,21,25,.35);
 --slab:linear-gradient(180deg,rgba(220,225,240,.06),rgba(10,12,22,.26)),linear-gradient(165deg,#959593 0%,#898989 45%,#7b7c7e 100%);
 --tile:linear-gradient(180deg,#9a9a98 0%,#898989 55%,#767779 100%)}
:root[data-theme="light"]{--card:#a3a29e;--s4:#878784;--s5:#a3a29e;--s6:#b9b8b3;--s7:#d0cec7;--s8:#e6e3da;
 --slab:linear-gradient(180deg,rgba(255,250,235,.07),rgba(10,12,22,.2)),linear-gradient(165deg,#b0afab 0%,#a3a29e 45%,#939290 100%);--tile:linear-gradient(180deg,#b3b2ae 0%,#a3a29e 55%,#8f8e8b 100%)}
:root{--hud:var(--moss)}
html{scrollbar-color:var(--s3) var(--s1)}
/* every letter is pixel blackletter, never faux-bold, never smoothed */
*{font-family:var(--fb)!important;font-weight:400!important;font-synthesis:none;-webkit-font-smoothing:none;-moz-osx-font-smoothing:auto;letter-spacing:0}
body{background:var(--bg);color:var(--ink);font-size:calc(21px*var(--ts,1));line-height:1.15;font-variant-numeric:lining-nums}
h1{font-family:var(--fl)!important;font-size:calc(42px*var(--ts,1));line-height:1;color:#e8b83c;text-shadow:2px 2px 0 #1a0f04}
#ttl{font-size:calc(21px*var(--ts,1));line-height:1;color:var(--s1);text-shadow:var(--cut)}
.hd{font:400 calc(21px*var(--ts,1))/1.1 var(--fh)!important;color:var(--moss-ink);text-shadow:var(--cut)}
.mute{font-size:calc(21px*var(--ts,1));line-height:1.1;color:var(--mute);text-shadow:var(--cut)}
.q,.lg,.it,.hp,.tn{font-size:calc(21px*var(--ts,1));line-height:1.1;text-shadow:var(--cut)}
.q{border-top:1px solid var(--s3);box-shadow:0 1px 0 var(--s6) inset}.q:first-of-type{border-top:0;box-shadow:none}.q.done{color:var(--ok)}
.stats{font-size:calc(21px*var(--ts,1));line-height:1.1;flex-wrap:wrap;gap:0 12px;color:var(--ink);text-shadow:var(--cut)}
.stats b,#rt,#xpt,#bh,.q span:last-child,.lg .mute{color:var(--num);text-shadow:var(--cut)}
.row{flex-wrap:wrap;gap:4px 10px}.row>.hd{min-width:0;overflow-wrap:anywhere}
/* slabs */
.card,.mod,#wmp{position:relative;background:var(--slab)!important;backdrop-filter:none;border:2px solid var(--s1);border-top-color:var(--s7);border-left-color:var(--s6);border-radius:0;box-shadow:inset 0 0 0 1px var(--s3),3px 3px 0 rgba(2,3,6,.6);color:var(--ink)}
.wrap>section.card,#side .card{border:2px solid var(--s1);border-top-color:var(--s7);border-left-color:var(--s6);box-shadow:inset 0 0 0 1px var(--hud),3px 3px 0 rgba(2,3,6,.6)!important}
.card::before,.card::after,.mod::before,.mod::after{content:'';position:absolute;border:0;pointer-events:none}
.card::before,.mod::before{top:-3px;left:-2px;width:60px;height:8px;background:linear-gradient(90deg,var(--moss),var(--lichen) 40%,transparent)}
.card::after,.mod::after{display:none}
.wrap>header{background:var(--slab)!important;border-bottom:2px solid var(--s1);box-shadow:0 2px 0 var(--hud),0 4px 0 rgba(2,3,6,.6)!important;color:var(--ink)}
#ov{background:rgba(3,5,4,.8);backdrop-filter:none}
/* stone tiles */
.mini,.wide,#btns button,.eqs button,.tn{background:var(--tile)!important;color:var(--ink);border:2px solid;border-color:var(--s7) var(--s1) var(--s0) var(--s6);border-radius:0;box-shadow:0 2px 0 rgba(2,3,6,.7);text-shadow:var(--cut);transition:transform .08s,border-color .1s}
.mini,.wide{font-size:calc(21px*var(--ts,1))!important;line-height:1!important;min-height:36px;padding:4px 10px}
.wide{min-height:44px}
.mini:hover,.wide:hover,#btns button:hover,.eqs button:hover,.tn.av:hover{border-color:var(--rune) var(--moss) var(--moss) var(--lichen)}
.mini:active,.wide:active,#btns button:active,.eqs button:active,.tn:active{transform:translateY(2px);border-color:var(--s0) var(--s6) var(--s7) var(--s1);box-shadow:none}
.mini.on,.wide.on,.tn.un{background:linear-gradient(180deg,#4f6e45,#38523d 55%,#2a3f2b)!important;color:#eef5e2;text-shadow:1px 1px 0 #0b140c;border-color:var(--rune) var(--moss) #0b140c var(--lichen)}
.mini:disabled{filter:grayscale(.6) brightness(.8);cursor:default;transform:none}
button:focus-visible,select:focus-visible{outline:2px solid var(--rune);outline-offset:2px}
#btns button{position:relative}
#btns b{font-size:calc(21px*var(--ts,1));line-height:1;color:var(--ink);text-align:center;overflow-wrap:normal;text-shadow:var(--cut)}

.card>.row:first-child>.mute,#xpt,#bh,#rt{color:#e8d48a!important;text-shadow:1px 1px 0 #000!important}
.stats b,.q span:last-child,.lg .mute{color:var(--num)}
.q.done,.q.done span{color:#1d4a1f}
/* left column: one width for the level slab and both plaques; plaques read name | figure */
#scw{display:flex;flex-direction:column;gap:8px}
#rg,#mq{display:flex!important;flex-wrap:wrap;justify-content:space-between;gap:0 10px;width:auto;margin:0!important;text-align:left}
#rg b,#mq b{color:var(--moss-ink)}#rg .n,#mq .n{color:var(--num);margin-left:auto}
.pcfg{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 8px}.pcfg label{white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
/* moss grows in clumps, a third pattern for every third slab; lichen differs per slab */
html.pxui #side .card:nth-child(3n)::before{background-image:var(--ui-moss3)}
html.pxui .card::after,html.pxui .mod::after{width:calc(var(--px)*14);height:calc(var(--px)*6);background:var(--ui-lichen0) 0 0/100% 100%;bottom:calc(var(--px)*-1);right:calc(var(--px)*9)}
html.pxui #side .card:nth-child(2)::after,html.pxui .mod::after{background-image:var(--ui-lichen1);right:auto;left:calc(var(--px)*12)}
html.pxui #side .card:nth-child(3)::after{background-image:var(--ui-lichen2);right:calc(var(--px)*30)}
html.pxui #side .card:nth-child(4)::after{display:none}
html.pxui .wrap>section.card::after{background-image:var(--ui-lichen2);right:auto;left:calc(var(--px)*40)}
/* dropdowns: carved stone wells with a pixel chevron, not browser chrome */
.pcfg select{-webkit-appearance:none;appearance:none;color:#e6e3da;text-shadow:1px 1px 0 #000;padding:0 24px 0 6px;cursor:pointer;
 background:var(--ui-arrow,none) no-repeat right 6px center/14px 8px,#3a3c42!important;
 box-shadow:inset var(--px,2px) var(--px,2px) 0 #0d0e10,inset calc(var(--px,2px)*-1) calc(var(--px,2px)*-1) 0 #5d5f65,1px 1px 0 #bdbcb8}
.pcfg select option{background:#2c2e34;color:#e6e3da}
/* hotkey plaques all wear the same iron */
#btns button[data-k] small{color:#d8e8c4}
/* the chest waits on the road (click it, or press O); the gold button only returns when the scene is hidden */
#ch{display:none!important}body.cp #ch:not([hidden]){display:block!important}
/* news arrives at the left, beside the action, never on top of the hero */
@media(min-width:900px){:where(html:not(.nrw)) #toast{left:12px;right:auto;width:340px;top:auto;bottom:calc(var(--barh,120px) + 14px);align-items:stretch;padding:0}:where(html:not(.nrw)) #toast div{max-width:none}}
@media(max-width:899px){#toast{top:calc(var(--hdh,100px) + 8px);bottom:auto}}
:where(html.nrw) #toast{top:calc(var(--hdh,100px) + 8px);bottom:auto}
/* armoury rows: icon | name over its stats | buttons side by side */
.mod .it{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:10px;row-gap:3px}
.mod .it>.ic{grid-column:1;grid-row:1/span 2}
.mod .it>.nm{grid-column:2;grid-row:1;justify-self:start;min-width:0}
.mod .it>.nm~.mute{grid-column:2;grid-row:2}
.mod .it>.nm~.mute~.mute,.mod .it>button{grid-row:1/span 2;grid-column:auto}
@media(max-width:899px){.mod .it>button{grid-row:auto;grid-column:3}}
:where(html.nrw) .mod .it>button{grid-row:auto;grid-column:3}
.it .nm,.drop .nm{background:#26282d;box-shadow:inset var(--px,2px) var(--px,2px) 0 #0b0c0e,inset -1px -1px 0 #45474e,1px 1px 0 #a1a1a0}
.ic{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center}.ic.big{width:84px;height:84px}
.ic .px,.cst .px,.hb .px{image-rendering:pixelated;display:block}
.cst{display:flex;justify-content:center;animation:none}
/* header: the four places (icon, name, key) then the four switches as plain glyph tiles */
.hb{align-items:center;gap:6px}
.hb .mini{display:inline-flex;align-items:center;gap:6px;position:relative;padding:3px 10px 3px 6px}
.hb .ico{padding:3px 5px;min-width:0}
.hb .hk{font-size:calc(21px*var(--ts,1));line-height:1;color:#d8e8c4;background:var(--s1);padding:1px 5px;box-shadow:inset 1px 1px 0 #000,1px 1px 0 var(--s7);text-shadow:1px 1px 0 #000}
.hb .bd{position:absolute;top:-8px;right:-6px;font-size:calc(21px*var(--ts,1));line-height:1;color:#1a1406;padding:1px 4px;background:linear-gradient(180deg,#f0d880,#c9ad5c 55%,#8a7030);box-shadow:1px 1px 0 #000,inset 0 0 0 1px #6a5420;text-shadow:none;z-index:2}
.hb .bd:empty{display:none}
.hb .sep{width:10px}
@media(max-width:899px){
 .hb{width:100%;flex-wrap:nowrap;gap:6px}.hb .sep{display:none}
 .hb .lb,.hb .hk{display:none}html .hb .mini,html.pxui .hb .mini{flex:1 1 0;min-height:40px;padding:0 0 2px!important;justify-content:center}
}
:where(html.nrw) .hb{width:100%;flex-wrap:nowrap;gap:6px}:where(html.nrw) .hb .sep{display:none}:where(html.nrw) .hb .lb,:where(html.nrw) .hb .hk{display:none}html:where(.nrw) .hb .mini,html.pxui:where(.nrw) .hb .mini{flex:1 1 0;min-height:40px;padding:0 0 2px!important;justify-content:center}
/* world map: the parchment sits in a dark carved basin */
#wmf{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:#141519;border:2px solid;border-color:var(--s1) var(--s6) var(--s7) var(--s1);box-shadow:inset 3px 3px 0 #000}
#wmg{flex:none!important;border:0!important;background:none!important;box-shadow:none!important;image-rendering:pixelated;min-width:0}
/* deed tiles: room either side so two-word names wrap inside the stone instead of touching its rim */
html.pxui #btns button{padding-left:6px;padding-right:6px}
/* the boss's lifeblood: a calmer flow than the rune-liquid bars */
.bar.boss i::before{opacity:.35}

/* ===== TITLE SCREEN: built from the game's own pieces. The live forest walks on behind it; the gilded logo is the header's,
   only larger; the subtitle is carved into a mossy granite plaque and the menu sits on a slab with the same stone tiles. ===== */
#title{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;overflow:auto;
 padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));
 background:radial-gradient(ellipse 72% 62% at 50% 44%,rgba(3,2,10,0) 0,rgba(3,2,10,.5) 70%,rgba(2,1,6,.86) 100%);animation:tlin .6s steps(6)}
#title[hidden]{display:none}
#title.out{opacity:0;transition:opacity .32s steps(4)}
@keyframes tlin{from{opacity:0}to{opacity:1}}
body.tl .wrap,body.tl #toast{visibility:hidden}
.tl-in{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;max-width:100%;margin:0 auto auto;padding-top:clamp(12px,7vh,90px)}
.tl-logo{margin:0;font:400 84px/1 var(--fl)!important;color:#e8b83c;text-shadow:4px 4px 0 #1a0f04}
html.pxlogo .tl-logo{width:var(--tlogo-w);height:var(--tlogo-h);background:var(--tlogo) no-repeat 0 0/100% 100%;color:transparent!important;text-shadow:none;
 overflow:hidden;white-space:nowrap;image-rendering:pixelated;filter:drop-shadow(0 0 16px rgba(232,184,60,.38))}
/* the subtitle: dark ink cut into moonlit granite, with gilt rules either side */
.tl-sub{margin:0!important;display:flex;align-items:center;gap:14px;font-size:calc(42px*var(--ts,1))!important;line-height:1;color:var(--ink);text-shadow:var(--cut)}
.tl-sub i{display:block;width:clamp(16px,4vw,48px);height:4px;background:#c9ad5c;box-shadow:0 2px 0 #5a3206,0 -2px 0 #fff2b8}
html.pxui .tl-sub{padding:calc(var(--px)*3 + 4px) calc(var(--px)*3 + 14px)!important}
/* the menu slab */
.tl-menu{margin:6px 0 0!important;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:min(440px,100%)}
#tgo{font-size:calc(42px*var(--ts,1))!important;line-height:1!important;min-height:0;display:inline-flex;align-items:center;justify-content:center;gap:16px;padding:14px 26px 14px 30px}
html.pxui #tgo{padding:calc(var(--px)*2 + 10px) calc(var(--px)*2 + 20px)}
#tgo .hk{font-size:calc(21px*var(--ts,1));line-height:1;color:#d8e8c4;background:var(--s1);padding:2px 6px;box-shadow:inset 1px 1px 0 #000,1px 1px 0 var(--s7);text-shadow:1px 1px 0 #000}
.tl-sum{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 0;color:var(--mute);text-shadow:var(--cut)}
.tl-sum b{color:var(--num)}
.tl-sum span+span::before{content:'';display:inline-block;width:6px;height:6px;margin:0 10px 3px 10px;background:#38523d;box-shadow:0 0 0 1px #141519}
@media(hover:none){#tgo .hk{display:none}}
@media(max-width:899px){.tl-sub{font-size:calc(21px*var(--ts,1))!important;gap:10px}#tgo{font-size:calc(21px*var(--ts,1))!important;padding:12px 20px}.tl-in{gap:16px}.tl-logo{font-size:calc(42px*var(--ts,1))!important}}
:where(html.nrw) .tl-sub{font-size:calc(21px*var(--ts,1))!important;gap:10px}:where(html.nrw) #tgo{font-size:calc(21px*var(--ts,1))!important;padding:12px 20px}:where(html.nrw) .tl-in{gap:16px}:where(html.nrw) .tl-logo{font-size:calc(42px*var(--ts,1))!important}

/* ===== ONE SLAB A SIDE: your standing on the left; the Raid, the day's quests, the week's foe and your last deed on the right.
   Fewer rims, mosses and gaps between the player and the forest. ===== */
#scw{display:none!important}
.wrap>section.card .sub{margin-top:8px;padding-top:8px;border-top:2px solid var(--s3);box-shadow:inset 0 2px 0 var(--s6);display:flex;flex-direction:column;gap:3px}
html.pxui .wrap>section.card #rg,html.pxui .wrap>section.card #mq,.wrap>section.card #rg,.wrap>section.card #mq{border:0!important;border-image:none!important;background:none!important;box-shadow:none!important;padding:0!important;margin:0!important;font-size:calc(21px*var(--ts,1));line-height:1.15}
@media(min-width:900px){html.pxui:where(:not(.nrw)) #side{position:relative}}
html.pxui #side{border:2px solid transparent;border-image:var(--ui-rim2) var(--sl4)/calc(var(--px)*4)/0 repeat;background:var(--ui-face) repeat 0 0/var(--ui-face-sz) var(--ui-face-sz)!important;
 box-shadow:var(--px) var(--px) 0 rgba(2,3,6,.65);padding:calc(var(--px)*4 + 6px) calc(var(--px)*3 + 6px) calc(var(--px)*3 + 6px)!important;image-rendering:pixelated;align-self:start}
html.pxui #side::before{content:'';position:absolute;top:0;left:0;right:0;height:calc(var(--px)*10);background:var(--ui-moss2) repeat-x 0 0/calc(var(--px)*64) calc(var(--px)*10);image-rendering:pixelated;pointer-events:none;z-index:1}
html.pxui #side .card,#side .card{border:0!important;border-image:none!important;background:none!important;box-shadow:none!important;padding:0!important;margin:0!important}
html.pxui #side .card::before,html.pxui #side .card::after{display:none!important}
html.pxui #side .card+.card,#side .card+.card{margin-top:12px!important;padding-top:12px!important;border-top:2px solid var(--s3)!important;box-shadow:inset 0 2px 0 var(--s6)!important}
/* Raid: the status line only while a session runs; lengths fold behind their own small tile */
#pst:empty{display:none}
.rrow{display:flex;gap:8px;align-items:stretch}.rrow #rbtn{flex:1;min-width:0}#rlen{flex:none;padding:0 10px}
.pcfg[hidden]{display:none!important}
/* system controls live on the title screen */
.tl-sys{display:flex;gap:10px;justify-content:center;margin-top:2px}.tl-sys [hidden]{display:none}
@media(max-width:899px){
 .wrap>section.card{grid-column:1/-1!important;margin:0 8px!important}
 .wrap>section.card .stats{gap:0 14px}
 html.pxui #side{padding-top:calc(var(--px)*4 + 6px)!important}
}
:where(html.nrw) .wrap>section.card{grid-column:1/-1!important;margin:0 8px!important}:where(html.nrw) .wrap>section.card .stats{gap:0 14px}html.pxui:where(.nrw) #side{padding-top:calc(var(--px)*4 + 6px)!important}

/* ===== REWARDS: the combo meter, the quest board's chest row, the guide ===== */
/* combo: a short ember groove that drains as the combo window closes (shown only during a Raid) */
#cmb{display:flex;align-items:center;gap:8px;margin:8px 0 0}#cmb[hidden]{display:none}
#cmb span{color:var(--mute)}#cmb b{color:#7a2a08;min-width:3.2em}
#cmb .bar{flex:1;height:12px;margin:0}
#cmw{background:linear-gradient(180deg,#ffe08a 0 25%,#f8a42a 25% 50%,#d9650f 50% 75%,#7a2408 75%)!important;box-shadow:0 0 9px rgba(248,164,42,.7)!important;transition:width 1s steps(4)}
/* the quest board's last row: all three cleared earns a chest */
.q.qa{border-top:2px dotted var(--s3);box-shadow:none;color:var(--mute)}.q.qa.done,.q.qa.done span{color:#7a5a10}
/* the guide: deed sigils as its waymarks */
.it.gd .ic{background:var(--s1)}.it.gd .ic .sig{width:32px;height:32px}
.it.gd .nm{background:none!important;box-shadow:none!important;padding:0!important;color:var(--moss-ink)!important;text-shadow:var(--cut)!important}

/* ===== FIXES: the opened chest, live boons, the Raid on phones, gear slots ===== */
/* the prize rises out of the opened chest */
.drop{display:flex;flex-direction:column;align-items:center}
.drop .ic.big{animation:rise .6s steps(6) both}@keyframes rise{from{transform:translateY(36px);opacity:0}to{transform:none;opacity:1}}
.cst.op{margin:-8px 0 8px}
/* boons in force: small iron plaques with their time left */
#bns{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:3px}#bns:empty{display:none}
#bns .bn{font-size:calc(21px*var(--ts,1));line-height:1;color:#e6e3da;background:var(--s1);padding:2px 6px;box-shadow:inset 1px 1px 0 #000,1px 1px 0 var(--s7);text-shadow:1px 1px 0 #000}
#bns .bn b{color:var(--c,#e8d48a)}
/* the Raid timer joins the status slab while the side panel is tucked away (the phone default) */
#rch{display:flex;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 8px;background:#2c2e34;color:#e6e3da;text-shadow:1px 1px 0 #000;cursor:pointer;
 box-shadow:inset 0 var(--px,2px) 0 #0d0e10,inset 0 calc(var(--px,2px)*-1) 0 #45474e}
#rch b{color:#e8d48a}#rch:empty,body:not(.nosp) #rch{display:none}
/* gear slots: an empty slot shows the faint shape of what belongs there */
.eqs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.eqs .ghost{background:transparent!important;box-shadow:none!important;border-color:transparent!important}.eqs .ghost img{opacity:.3;filter:grayscale(1)}
@media(max-width:899px){.eqs .sl{font-size:calc(14px*var(--ts,1))!important;line-height:1}.eqs button{min-height:76px;padding:4px 1px}}
:where(html.nrw) .eqs .sl{font-size:calc(14px*var(--ts,1))!important;line-height:1}:where(html.nrw) .eqs button{min-height:76px;padding:4px 1px}

/* ===== WAYSTONE: the UI's own pixel book hand (embedded, so it never waits on the network). The title and its
   subtitle keep their Jacquard blackletter; everything you read while playing is set in Waystone on the same
   21px grid, so a pixel of a letter is always a whole pixel of the screen. ===== */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"],:root[data-theme="light"]{--fh:'Waystone','Jacquard 12',monospace;--fb:'Waystone','Jacquard 12',monospace}
.tl-sub,.tl-sub *{font-family:'Jacquard 12',monospace!important}
/* tight places on a phone take Waystone Small at its native 14px, never a squeezed Waystone */
@media(max-width:899px){
 #btns b,#btns small,#ttl,.eqs .sl{font-family:'Waystone Small','Waystone',monospace!important;font-size:calc(14px*var(--ts,1))!important;line-height:1!important}
}
:where(html.nrw) #btns b,:where(html.nrw) #btns small,:where(html.nrw) #ttl,:where(html.nrw) .eqs .sl{font-family:'Waystone Small','Waystone',monospace!important;font-size:calc(14px*var(--ts,1))!important;line-height:1!important}
/* headings are cut like inscriptions: serifed capitals, a pixel of air between them (values in the Hero sheet stay as written) */
.hd{text-transform:uppercase;letter-spacing:1px}
.hp .hd{text-transform:none;letter-spacing:0}
/* legibility: secondary words in a darker ink, so every line on the stone clears the contrast it needs */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"],:root[data-theme="light"]{--mute:#1b1c20;--moss-ink:#0d240e}
#ttl{color:var(--ink)}
/* an unaffordable price or a locked talent dims its stone, never its words */
.mini:disabled{opacity:1!important;filter:grayscale(.8) brightness(.86)!important;cursor:not-allowed}
.tn.lk{opacity:1!important;filter:grayscale(.8) brightness(.86);cursor:not-allowed}
/* the rarity of an opened prize sits on the same dark plaque as its name */
.drop>.hd{padding:2px 8px;background:#26282d;box-shadow:inset 2px 2px 0 #0b0c0e,inset -1px -1px 0 #45474e,1px 1px 0 #a1a1a0;text-shadow:1px 1px 0 #000}
/* on a dark plaque (an Order's name, its calling), words are lit, not inked */
.it .nm .hd{color:#9fd36a!important;text-shadow:1px 1px 0 #000!important}
.it .nm .mute{color:#c9ccd4!important;text-shadow:1px 1px 0 #000!important}
html.pxui .mini:disabled{border-image-source:var(--ui-b2dn);box-shadow:none;transform:none}

/* ===== THE CODEX AND THE TOUR ===== */
/* codex rows: an icon in a dark socket, the name with its key and worth, what it means at work, then the detail */
.cx-r,.tut-d{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;align-items:start;padding:8px 0;border-top:1px solid var(--s3);box-shadow:inset 0 1px 0 var(--s6)}
.cx-r:first-of-type,.tut-d:first-of-type{border-top:0;box-shadow:none}
.cx-i{display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:#26282d;box-shadow:inset 2px 2px 0 #0b0c0e,inset -1px -1px 0 #45474e,1px 1px 0 #a1a1a0}
.cx-i .sig{width:32px;height:32px;image-rendering:pixelated}
.cx-i.cx-e{width:10px;height:auto;align-self:stretch;background:none;box-shadow:inset 3px 0 0 var(--lichen)}
.cx-t{min-width:0}
.cx-n{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.cx-n b{color:var(--ink)}
.cx-k{display:inline-block;color:#d8e8c4;background:var(--s1);padding:0 5px;line-height:1.1;box-shadow:inset 1px 1px 0 #000,1px 1px 0 var(--s7);text-shadow:1px 1px 0 #000}
.cx-v{color:var(--num);margin-left:auto}
/* what a deed means at work: a gilt label on a dark plaque */
.cx-m{display:inline-block;margin:3px 0 2px;color:#f0d880;background:#26282d;padding:1px 6px;box-shadow:inset 1px 1px 0 #000,1px 1px 0 var(--s7);text-shadow:1px 1px 0 #000}
.cx-d{color:var(--mute)}
.cx-how{margin:4px 0 8px;padding:8px 10px;background:rgba(20,21,25,.12);box-shadow:inset 0 0 0 2px var(--s3)}
.cx-how b{color:var(--moss-ink)}
.cx-how ol{margin:4px 0 0;padding-left:26px}.cx-how li{margin:2px 0}
.cx-lead,.cx-note{color:var(--mute);margin:4px 0 6px}
.cx-note{margin-top:10px}
.cx-keys{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;margin:8px 0}
.cx-keys .cx-k{justify-self:start;min-width:28px;text-align:center}
.cx-tour{width:100%;margin-top:12px}
#ovb em,.tut-b em{font-style:normal;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}

/* the tour: the Road dims, the part being explained is cut out and ringed in rune-light, a tablet explains it */
#tut{position:fixed;inset:0;z-index:80}
#tut[hidden]{display:none}
.tut-dim{position:absolute;inset:0;display:block}
.tut-dim path{fill:rgba(3,5,4,.76)}
.tut-rings i{position:absolute;box-sizing:border-box;border:2px solid #9fd36a;box-shadow:0 0 0 2px #0b140c,0 0 16px rgba(159,211,106,.5),inset 0 0 0 2px rgba(11,20,12,.6);animation:tutp 1.1s steps(3) infinite alternate;pointer-events:none}
@keyframes tutp{to{box-shadow:0 0 0 2px #0b140c,0 0 26px rgba(159,211,106,.85),inset 0 0 0 2px rgba(11,20,12,.6)}}
.tut-card{position:absolute;width:min(460px,calc(100vw - 24px));max-width:none;max-height:calc(100dvh - 24px);overflow:hidden;margin:0;display:flex;flex-direction:column}
/* if the tablet has to be short, its words scroll and its buttons stay put */
.tut-card>.row{flex:none}.tut-b{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin}.tut-f{flex:none}
.tut-n{color:#f0d880;text-shadow:1px 1px 0 #000;white-space:nowrap}
.tut-b p{margin:6px 0}
.tut-b .tut-s{color:var(--mute);margin-top:8px}
.tut-d{padding:5px 0}
.tut-d{align-items:center}.tut-d .cx-n .cx-m{margin:0}
.tut-f{display:flex;align-items:center;gap:8px;margin-top:12px}
.tut-sp{flex:1}
html.rm .tut-rings i{animation:none}
@media(max-width:899px){.cx-i{width:36px;height:36px}.cx-i .sig{width:32px;height:32px}.tut-f .mini{padding:4px 8px}}
:where(html.nrw) .cx-i{width:36px;height:36px}:where(html.nrw) .cx-i .sig{width:32px;height:32px}:where(html.nrw) .tut-f .mini{padding:4px 8px}
/* on a desktop the side panel ends above the deed bar's key plates instead of running beneath them */
@media(min-width:900px){html:where(:not(.nrw)) #side{max-height:calc(100dvh - var(--hdh,110px) - var(--barh,120px) - 20px)!important}}
.hb .bd{white-space:nowrap}
/* on a phone the banner's badges use the small face */
@media(max-width:899px){.hb .bd{font-family:'Waystone Small','Waystone',monospace!important;font-size:calc(14px*var(--ts,1))!important;line-height:1;top:-6px;right:-4px}}
:where(html.nrw) .hb .bd{font-family:'Waystone Small','Waystone',monospace!important;font-size:calc(14px*var(--ts,1))!important;line-height:1;top:-6px;right:-4px}
#bmn .bd{top:-13px;right:-12px}
@media(max-width:899px){#bmn .bd{top:-8px;right:-6px}}
:where(html.nrw) #bmn .bd{top:-8px;right:-6px}

/* ===== DAY/NIGHT DEBUG PANEL (only built when CYCLE.debug is true) ===== */
#dnd{position:fixed;left:12px;top:calc(var(--hdh,110px) + 10px);z-index:70;width:min(440px,calc(100vw - 24px));padding:8px 10px;background:rgba(20,21,25,.95);color:#e6e3da;box-shadow:inset 0 0 0 2px #45474e,3px 3px 0 rgba(2,3,6,.6);text-shadow:1px 1px 0 #000}
#dnd[hidden]{display:none}
.dnd-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.dnd-h b{color:#f0d880}
.dnd-r{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:5px 0}
.dnd-l{min-width:56px;color:#9fd36a}
#dnd-t{color:#ffffff;margin-right:10px}
#dnd .mini{min-height:32px;padding:2px 8px}
#dnd input{font:inherit;background:#2c2e34;color:#e6e3da;border:0;box-shadow:inset 1px 1px 0 #000,1px 1px 0 #5d5f65;padding:2px 6px;min-height:32px}

/* ===== CREATE CHARACTER ===== */
#hc{position:fixed;inset:0;z-index:66;display:flex;justify-content:center;overflow:auto;padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px));background:rgba(3,5,4,.84);animation:hcin .3s steps(5)}
#hc[hidden]{display:none}
#hc.out{opacity:0;transition:opacity .25s steps(4)}
@keyframes hcin{from{opacity:0}to{opacity:1}}
@keyframes hcup{from{transform:translateY(14px)}to{transform:none}}
body.hcon #title .tl-in{visibility:hidden}
#hc .hc-in{width:min(1100px,100%);margin:auto 0;padding:14px;display:flex;flex-direction:column;gap:10px;animation:hcup .3s steps(5)}
#hc :focus-visible{outline:2px solid #f0d880;outline-offset:2px}
.hc-hint{color:#d8e8c4;text-shadow:1px 1px 0 #000;font-size:calc(14px*var(--ts,1))!important;font-family:'Waystone Small','Waystone',monospace!important}
.hc-name{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.hc-l{color:var(--moss-ink)}
#hc-nm{font:inherit;flex:1 1 180px;max-width:320px;min-width:0;min-height:36px;padding:2px 8px;background:#26282d;color:#e6e3da;border:0;box-shadow:inset 2px 2px 0 #0b0c0e,1px 1px 0 #a1a1a0;text-shadow:1px 1px 0 #000}

#hc-nm[aria-invalid=true]{box-shadow:inset 0 0 0 2px #c8281c,1px 1px 0 #a1a1a0}
.hc-err{color:#6e1410;min-height:1em}
.hc-body{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
/* the preview: the true in-game sprite, scaled by whole pixels, on a little stage; the face close-up beside it */
.hc-pv{display:grid;grid-template-columns:auto auto;gap:10px 12px;align-items:end;justify-items:center;--hz:5;--pz:3}
.hc-stage{position:relative;width:calc(44px*var(--hz));height:calc(60px*var(--hz));background:radial-gradient(ellipse 60% 18% at 50% 92%,rgba(0,0,0,.45),transparent 70%),radial-gradient(ellipse at 50% 60%,#3d4048 0,#202228 72%);
 box-shadow:inset 0 0 0 2px #0b0c0e,inset 2px 2px 0 3px rgba(255,255,255,.05);cursor:grab;touch-action:pan-y;user-select:none}
.hc-stage:active{cursor:grabbing}
.hc-stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.hc-pop{animation:hcpop .3s steps(3)}
@keyframes hcpop{0%{filter:brightness(1.4)}100%{filter:none}}
.hc-side{display:flex;flex-direction:column;align-items:center;gap:6px}
.hc-face{background:linear-gradient(#3b3539,#211d21);border-radius:6px;box-shadow:inset 0 0 0 2px #0b0c0e,inset 0 2px 0 2px rgba(255,255,255,.05)}
.hc-face canvas{display:block;width:calc(48px*var(--pz));height:calc(48px*var(--pz));image-rendering:pixelated}
/* the Heroes tab: portrait tiles on dark rounded cards */
.hc-pre{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
#hc .hc-ps{min-height:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;background:#1d1a1d;color:#efe6d0;border:2px solid #0b0c0e;border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);font:inherit;line-height:1.2}
#hc .hc-ps canvas{width:96px;height:96px;image-rendering:pixelated;border-radius:6px;background:linear-gradient(#3b3539,#211d21)}
#hc .hc-ps b{margin-top:4px}
#hc .hc-ps small{color:#a8a29a}
#hc .hc-ps:hover{border-color:#5d5f65}
#hc .hc-ps.on{border-color:var(--gold);box-shadow:0 0 0 2px #1a120b,inset 0 0 0 1px var(--gold)}
.hc-vn{color:var(--mute)}
.hc-rot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.hc-rot .mini.on{filter:none}
/* the options */
.hc-opts{min-width:0;display:flex;flex-direction:column;gap:8px}
.hc-tabs{display:flex;flex-wrap:wrap;gap:6px}
.hc-tw{display:inline-flex;align-items:stretch}
.hc-lock{width:24px;min-height:36px;padding:0;border:0;background:#26282d no-repeat center/10px 14px;box-shadow:inset 1px 1px 0 #000,1px 1px 0 #a1a1a0;cursor:pointer;image-rendering:pixelated}
.hc-lock.on{background-color:#3a3220}
.hc-tip{color:var(--mute);padding-bottom:4px}
.hc-panel{max-height:min(54vh,480px);overflow:auto;padding:0 6px 4px 0;scrollbar-width:thin}
.hc-f{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--s3);box-shadow:inset 0 1px 0 var(--s6)}
.hc-sub{grid-column:1/-1;display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;align-items:center}
.hc-seg{display:flex;flex-wrap:wrap;gap:6px}
.hc-step{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.hc-val{flex:1 1 150px;display:flex!important;justify-content:space-between;gap:10px}
.hc-val small{color:var(--mute)}
.hc-sw{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.hc-pl{flex-basis:100%;color:var(--mute)}
.hc-row{display:flex;flex-wrap:wrap;gap:4px}
.hc-s{width:24px;height:24px;padding:0;border:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),1px 1px 0 #141519;cursor:pointer}
.hc-s:hover{transform:translateY(-1px)}
.hc-s.on{box-shadow:0 0 0 2px #141519,0 0 0 4px #9fd36a}
.hc-cust{display:inline-flex;align-items:center;gap:6px;padding:0 6px 0 0;cursor:pointer}
.hc-cust.on span{color:#1d4a1f;text-decoration:underline}
.hc-cust input{width:34px;height:26px;padding:0;border:0;background:none;cursor:pointer}
.hc-rng{display:flex;align-items:center;gap:10px}
.hc-rng input{flex:1;max-width:260px;accent-color:#6e8f5c}
.hc-rng span{color:var(--mute)}
/* save slots and the actions */
.hc-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hc-slot{display:flex!important;align-items:center;gap:8px;text-align:left;min-height:60px!important;padding:4px 8px!important}
.hc-slot canvas{width:48px;height:48px;flex:none;image-rendering:pixelated;background:linear-gradient(#3b3539,#211d21);border-radius:4px;box-shadow:inset 1px 1px 0 #000}
.hc-slot span{display:flex;flex-direction:column;min-width:0}
.hc-slot b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-slot small{color:var(--mute)}
.hc-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hc-sp{flex:1}
.hc-foot .wide{min-height:44px;padding:4px 16px}
.hc-msg{min-height:1.2em;color:var(--mute)}
/* the title's new button */
#tcc{font-size:calc(21px*var(--ts,1))!important;min-height:44px;padding:4px 18px}
@media(max-width:899px){
 .hc-body{grid-template-columns:minmax(0,1fr)}
 .hc-pv{--hz:3;--pz:2;grid-template-columns:auto auto}
 .hc-f,.hc-sub{grid-template-columns:minmax(0,1fr)}
 .hc-panel{max-height:none;overflow:visible}
 .hc-slots{grid-template-columns:minmax(0,1fr)}
 .hc-slot{min-height:52px!important}
 .hc-pre{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
 .hc-foot .hc-sp{display:none}.hc-foot .wide{flex:1 1 100%}
}
:where(html.nrw) .hc-body{grid-template-columns:minmax(0,1fr)}:where(html.nrw) .hc-pv{--hz:3;--pz:2;grid-template-columns:auto auto}:where(html.nrw) .hc-f,:where(html.nrw) .hc-sub{grid-template-columns:minmax(0,1fr)}:where(html.nrw) .hc-panel{max-height:none;overflow:visible}:where(html.nrw) .hc-slots{grid-template-columns:minmax(0,1fr)}:where(html.nrw) .hc-slot{min-height:52px!important}:where(html.nrw) .hc-pre{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}:where(html.nrw) .hc-foot .hc-sp{display:none}:where(html.nrw) .hc-foot .wide{flex:1 1 100%}
html.rm #hc,html.rm #hc .hc-in,html.rm .hc-pop{animation:none}

/* the title's hero portrait, on the same dark card as the creator's */
.tl-who{display:flex;align-items:center;justify-content:center;gap:12px;max-width:100%}
.tl-who .tl-sum{flex:0 1 auto;justify-content:flex-start}
#tpor{min-height:0;width:auto;padding:0;border:2px solid #0b0c0e;border-radius:6px;background:linear-gradient(#3b3539,#211d21);box-shadow:0 0 0 1px #5d5f65,2px 2px 0 #0b0c0e;flex:none;cursor:pointer}
#tpor canvas{display:block;width:96px;height:96px;image-rendering:pixelated;border-radius:4px}

:where(html.nrw6) #tpor canvas{width:72px;height:72px}:where(html.nrw6) .tl-who{gap:8px}

/* ===== AESTHETIC PASS: loaded last, so these settle the look over every earlier layer ===== */
/* the title: tighter on short screens so the hero stands in view beneath the menu */
@media(min-width:900px) and (max-height:860px){:where(html:not(.nrw)) .tl-in{gap:10px;padding-top:clamp(6px,1.5vh,16px)}:where(html:not(.nrw)) .tl-menu{gap:10px}html.pxui:where(:not(.nrw)) .tl-sub{padding-top:calc(var(--px)*2 + 2px)!important;padding-bottom:calc(var(--px)*2 + 2px)!important}html.pxui:where(:not(.nrw)) #tgo{padding-top:calc(var(--px)*2 + 4px);padding-bottom:calc(var(--px)*2 + 4px)}:where(html:not(.nrw)) #tpor canvas{width:72px;height:72px}}

/* ---- overlays: a window with tabs opens at a fixed height, so switching tabs never makes it jump */

@media(min-width:900px){:where(html:not(.nrw)) #ov:has(.mod .tabs){padding-top:max(16px,6vh)}:where(html:not(.nrw)) #ov:has(.mod .tabs) .mod{max-height:calc(100dvh - max(16px,6vh) - 16px)}}

}
:where(html.nrw) .mod .tabs{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}:where(html.nrw) .mod .tabs .mini{min-width:0;padding-left:2px!important;padding-right:2px!important;min-height:36px;white-space:nowrap;
  font-family:'Waystone Small','Waystone',monospace!important;font-size:calc(14px*var(--ts,1))!important;line-height:1!important}

/* ---- toasts: never more than three at once (the newest stay) */
#toast div:nth-last-child(n+4){display:none}

/* ---- the Order picker: a card per Order, its emblem in a dark well, the whole card the button */
.ord-in{margin:2px 0 12px;color:var(--mute);text-shadow:var(--cut)}
#ovb .ordc{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;margin:0 0 10px;padding:10px 12px 10px 10px;
 cursor:pointer;font:400 calc(21px*var(--ts,1))/1.15 var(--fb);background:#26282d;color:#e6e4dd;text-shadow:1px 1px 0 #000;
 box-shadow:inset 2px 2px 0 #0b0c0e,inset -2px -2px 0 #45474e,2px 2px 0 rgba(2,3,6,.55);transition:transform .08s}
#ovb .ordc .sig{box-sizing:content-box;width:48px;height:48px;padding:4px;image-rendering:pixelated;background:#141519;box-shadow:inset 2px 2px 0 #000,1px 1px 0 #5d5f65}
.ord-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.ord-t b{color:#9fd36a;text-transform:uppercase;letter-spacing:1px;font-weight:400}

#ovb .ordc:hover,#ovb .ordc:focus-visible{outline:none;box-shadow:inset 2px 2px 0 #0b0c0e,inset -2px -2px 0 #45474e,0 0 0 2px #9fd36a,2px 2px 0 rgba(2,3,6,.55)}
#ovb .ordc:hover .ord-s,#ovb .ordc:focus-visible .ord-s{background:linear-gradient(180deg,#f0d880,#c9ad5c 55%,#8a7030);color:#1a1406;text-shadow:none;box-shadow:inset 0 2px 0 #fff0b0,inset 0 -2px 0 #6a5420,1px 1px 0 #000}
#ovb .ordc:active{transform:translateY(2px)}

/* ---- the Hero tab's character sheet */
.sheet{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin:2px 0 10px;padding:10px 12px 10px 10px;
 background:#26282d;color:#e6e4dd;text-shadow:1px 1px 0 #000;box-shadow:inset 2px 2px 0 #0b0c0e,inset -2px -2px 0 #45474e,2px 2px 0 rgba(2,3,6,.5)}
.sh-por{display:block;width:96px;height:96px;image-rendering:pixelated;border-radius:6px;background:linear-gradient(#3b3539,#211d21);box-shadow:0 0 0 2px #0b0c0e,0 0 0 3px #5d5f65}
.sh-t{display:flex;flex-direction:column;gap:4px;min-width:0}

/* ---- the talent tree: a header per branch, the tiers lined up across the branches, the path between them drawn */
.tt{grid-template-rows:auto auto 18px auto 18px auto;row-gap:0!important;column-gap:12px!important}

 background:#26282d;box-shadow:inset 2px 2px 0 #0b0c0e,inset -1px -1px 0 #45474e,1px 1px 0 #a1a1a0;text-shadow:1px 1px 0 #000}

.chr-h.on .chr-col i{background:linear-gradient(90deg,#fff0b0 0 30%,#f0c04a 30% 75%,#b08020 75%);box-shadow:inset 0 2px 0 #fffbe0,0 0 8px rgba(240,192,74,.55)}

@media(max-width:899px){
 .chr-list{grid-template-columns:minmax(0,1fr)}
 .chr-top{grid-template-columns:repeat(2,minmax(0,1fr))}.chr-t,.chr-t:nth-child(n+4){grid-column:auto}.chr-t:last-child{grid-column:1/-1}
 .chr-hl,.chr-dh,.chr-dh *,.chr-d,.chr-d *,.chr-r small{font-family:'Waystone Small','Waystone',monospace!important;font-size:calc(14px*var(--ts,1))!important;line-height:1.1!important}
 .chr-r{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}.chr-r small{grid-column:1/-1;text-align:left}

}
:where(html.nrw) .chr-list{grid-template-columns:minmax(0,1fr)}:where(html.nrw) .chr-top{grid-template-columns:repeat(2,minmax(0,1fr))}:where(html.nrw) .chr-t,:where(html.nrw) .chr-t:nth-child(n+4){grid-column:auto}:where(html.nrw) .chr-t:last-child{grid-column:1/-1}:where(html.nrw) .chr-hl,:where(html.nrw) .chr-dh,:where(html.nrw) .chr-dh *,:where(html.nrw) .chr-d,:where(html.nrw) .chr-d *,:where(html.nrw) .chr-r small{font-family:'Waystone Small','Waystone',monospace!important;font-size:calc(14px*var(--ts,1))!important;line-height:1.1!important}:where(html.nrw) .chr-r{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}:where(html.nrw) .chr-r small{grid-column:1/-1;text-align:left}:where(html.nrw) .chr-dh,:where(html.nrw) .chr-d{gap:4px}:where(html.nrw) .chr-col{height:44px}

/* ===== THE MENU (Esc): a narrow slab of full-width stone tiles; a switch's state sits on a dark plaque ===== */

/* the Codex's Banner leaf: the Menu's own rows, under their own heading */
.cx-lead.cx-sub{margin-top:16px}

/* ===== THE WORLD MAP: a sector not yet reached opens as a preview ===== */
#wms .wm-tag{margin-left:10px;padding:1px 6px;vertical-align:2px;font-family:'Waystone Small','Waystone',monospace!important;font-size:calc(14px*var(--ts,1));font-weight:400;line-height:1;letter-spacing:1px;text-transform:uppercase;color:#1a1406;background:linear-gradient(180deg,#f0d880,#c9ad5c 55%,#8a7030);box-shadow:1px 1px 0 #000,inset 0 0 0 1px #6a5420;text-shadow:none}
.wm-ahead{margin:0 0 10px;padding:6px 10px;color:#e6e3da;background:#26282d;box-shadow:inset 3px 0 0 #f0c04a,inset 2px 2px 0 #0b0c0e,inset -1px -1px 0 #45474e,1px 1px 0 #a1a1a0;text-shadow:1px 1px 0 #000}
.wm-ahead b{font-weight:400;color:#ffd666}
#wmt .ahead{opacity:.88}

/* ===== TODAY'S FUNNEL: articles drafted ride on parchment (holdfasts keep the red seal, now the fifth bar) ===== */
html.pxui .bar.fn3 i{background:linear-gradient(180deg,#fff4d6 0 25%,#d8bc84 25% 50%,#a88a56 50% 75%,#5e4728 75%)!important;box-shadow:0 0 9px rgba(216,188,132,.5)}

/* ===== REVIEW FIXES (v31) ===== */

#sk{display:block;width:100%;margin:8px 0;padding:6px 8px;resize:vertical;border:0;border-radius:0;font-family:'Waystone Small','Waystone',monospace!important;font-size:calc(14px*var(--ts,1));line-height:1.25;
 color:#e6e3da;background:#26282d;text-shadow:1px 1px 0 #000;box-shadow:inset 2px 2px 0 #0b0c0e,inset -1px -1px 0 #45474e,1px 1px 0 #a1a1a0;word-break:break-all}
#sk::placeholder{color:#8a8c94}

.qs-t{font-family:'Waystone Small','Waystone',monospace!important;font-size:calc(14px*var(--ts,1));line-height:1;padding:2px 5px;color:#eef5e2;background:linear-gradient(180deg,#4f6e45,#38523d 55%,#2a3f2b);box-shadow:1px 1px 0 #000,inset 0 0 0 1px #6e8f5c;text-shadow:1px 1px 0 #0b140c}

#ql{position:fixed;inset:0;z-index:20;overflow-y:auto;overscroll-behavior:contain;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
 background:radial-gradient(ellipse 80% 60% at 50% 0,#1b221c,#0b0e0c 70%) #0b0e0c}

/* the status line keeps streak and gold (XP today stays on the Road) */
body.ql .stats:not(#qln)>span:nth-child(3){display:none}
#ql #ch:not([hidden]){display:inline-flex!important;position:static!important;margin:0!important;width:auto!important;height:auto!important}

/* ===== COMPANIONS (v36): the rules. The pet on the Road is drawn with the hero (the engine); the Bazaar, the merchant's rare
   find, naming, the Hero tab and the plaque are at the end of the script (pet.js).
   An owl or a fox may join the hero: from the Bazaar, or now and then as a rare find from the wandering merchant. Both may be
   owned; one walks with the hero at a time, and only its gift counts (it is added in bon(), so it stacks with gear, elixirs
   and talents). Bond belongs to the player, so both pets share it: it starts at 1 with the first pet and moves a day closer
   to the next level on each day that extends the streak (the day's first deed while the streak holds, by the streak's own
   rules). A broken streak never lowers it; it only waits for the streak to resume.
   State: S.pets {owl|fox: {n name, t when it joined}}, S.pet the one walking, S.bond {d streak days counted, t since}. ===== */
const PET={
 unlock:15,                 // the level companions unlock at: below it the Bazaar shows them locked and no merchant brings one
 price:1500,                // in the Bazaar (Merchant's Eye takes its 10% off, as on gear)
 deal:1000,                 // the wandering merchant's rare find
 chance:.2,                 // how often a merchant brings one (only a pet the player does not own yet)
 need:[2,3,3,4,4,5,5,6,6],  // streak days from each Bond level to the next: 1 to 2 needs 2 ... 9 to 10 needs 6 (38 in all)
 looks:[4,8],               // Bond levels where the look changes: a brighter coat, then a rune collar (fox) or a feather crest (owl)
 // each pet's gift by Bond level (1-10): t 'g' gold in %, 'combo' the combo window in seconds; c its colour; kit the merchant's word
 kinds:{
  owl:{n:'Owl',c:'#ffd23f',t:'g',v:[5,6,6,7,7,8,8,9,9,10],kit:'an owlet',d:'Perches and flaps beside you',
   names:['Ember','Sage','Pip','Nyx','Talon','Moth','Quill','Hazel','Wisp','Oriel','Juniper','Zephyr','Bramble','Soot','Luna']},
  fox:{n:'Fox',c:'#ff9a3a',t:'combo',v:[15,17,18,20,22,23,25,27,28,30],kit:'a fox kit',d:'Trots at your heels',
   names:['Rusty','Sorrel','Vix','Copper','Flint','Tod','Maple','Russet','Briar','Cinder','Fennec','Juno','Rook','Ziggy','Kit']}}};
const PETK=Object.keys(PET.kinds);
// companions are unlocked from level PET.unlock (counted as unlocked while the save is still loading, before XP can be summed)
const petsUnlocked=()=>{try{return lvl(total()).L>=PET.unlock}catch(e){return true}};
// a level-up that reaches the unlock level from below it is announced, once (S.petu): a toast, a banner, a chime
function petUnlockCheck(L0,L1){if(S.petu||L0>=PET.unlock||L1<PET.unlock)return;S.petu=1;say('Companions have found you. Visit the Bazaar.',true);E.cel('COMPANIONS UNLOCKED','#ffb03a');setTimeout(()=>{try{snd('pet')}catch(e){}},900)}
let PN=null,PDF=0;// the naming window {k, fresh: just joined}; the debug panel's next merchant brings a pet
const petHas=()=>!!S.pets&&PETK.some(k=>S.pets[k]);
const petOn=()=>S.pets&&PET.kinds[S.pet]&&S.pets[S.pet]?S.pet:null;// the one walking with the hero
const petName=k=>(S.pets&&S.pets[k]&&S.pets[k].n)||PET.kinds[k].n;
// Bond: the level (1-10), the streak days into it (r) and the days it needs
function petBond(){const d=Math.max(0,(S.bond&&S.bond.d)|0);let L=1,r=d;while(L<10&&r>=PET.need[L-1]){r-=PET.need[L-1];L++}return{L,r,need:L<10?PET.need[L-1]:0,d}}
const petStage=L=>L>=PET.looks[1]?2:L>=PET.looks[0]?1:0;
const petVal=(k,L)=>PET.kinds[k].v[Math.min(10,Math.max(1,L))-1];
const petGift=(k,L)=>PET.kinds[k].t==='g'?'+'+petVal(k,L)+'% gold':'+'+petVal(k,L)+'s combo';
// the walking pet's gift: a share of gold, or seconds on the combo window
function petBon(b){const k=petOn();if(!k)return;const K=PET.kinds[k],v=petVal(k,petBond().L);b[K.t]+=K.t==='g'?v/100:v}
const petPrice=()=>Math.round(PET.price*(tl('b2')?.9:1));
function petRand(k,not){const L=PET.kinds[k].names.filter(n=>n!==not);return L[Math.floor(Math.random()*L.length)]}
// the day's first deed while the streak holds brings Bond a day closer ('P' on the deed, so Undo takes the day back)
function petDay(ev){if(!petHas())return;if(!S.bond)S.bond={d:0,t:ev.t};const L0=petBond().L;S.bond.d++;ev.r.push('P');const L1=petBond().L;if(L1>L0)petLevel(L1)}
function petUndo(e){if(Array.isArray(e.r)&&e.r.includes('P')&&S.bond)S.bond.d=Math.max(0,(S.bond.d|0)-1)}
// a new Bond level: a toast, a banner with the pet's name and a chime
function petLevel(L){const k=petOn()||PETK.find(j=>S.pets[j]);if(!k)return;const n=petName(k);
 say(n+' and you grow closer: Bond '+L+'! '+petGift(k,L)+' now.'+(L===PET.looks[0]?' '+n+'\'s '+(k==='fox'?'coat':'feathers')+' shine brighter.':L===PET.looks[1]?' '+n+(k==='fox'?' now wears a glowing rune collar.':' grows a crest of glowing feathers.'):''),true);
 E.cel(n.toUpperCase()+' BOND '+L,PET.kinds[k].c);snd('bond')}
// the merchant's rare find: sometimes one of the two deals is a pet the player does not own (PDF: the debug panel's sure one)
function petDeal(V){const L=PETK.filter(k=>!(S.pets&&S.pets[k]));if(!L.length||!(PDF||(petsUnlocked()&&Math.random()<PET.chance)))return;if(PDF)S.rev.pd=1;PDF=0;
 S.rev.pk=L[Math.floor(Math.random()*L.length)];S.rev.d=S.rev.d.slice(0,Math.max(1,(V.pick||2)-1))}
// a find that no longer makes sense (an unknown pet, one bought since, or one offered below the unlock level) goes, and the merchant's usual deals fill its place
function petDealNorm(V){const R=S.rev;if(!R||R.pk==null)return;if(V.kind==='deal'&&PET.kinds[R.pk]&&!(S.pets&&S.pets[R.pk])&&(R.pd||petsUnlocked()))return;delete R.pk;delete R.pd;
 if(V.kind==='deal'&&Array.isArray(R.d)){const F=rvDeals(V).filter(i=>!R.d.includes(i));while(R.d.length<(V.pick||2)&&F.length)R.d.push(F.shift())}}
/* ===== WEATHER (v37): the season (the real month of this week's Monday) and a roll seeded by the week pick this week's
   weather, so it holds all week and after a reload. The engine draws it (src/weather_engine.js); Settings can turn it off
   (S.set.wx 'auto' or 'off'), and the day/night debug panel can override it for the session (WXO).
   Seasons: the months they cover (0 = January), the weekly roll's weights, and their character (warm: a summer rain is
   lighter and warmer; cold: a clear winter week is cold). Kinds: what the engine draws (max particles at a full frame budget,
   fall speed range in road units a second, palette painted for night, as the day grade lifts the whole world, sway and wind,
   how long some settle on the road, the height they fall from (leaves and petals from the trees, the rest from the sky), fog thickening, and the look over the scene) ===== */
const WX={
 seasons:[

  {n:'winter',m:[11,0,1],w:{snow:6,clear:3},cold:1},
  {n:'spring',m:[2,3,4],w:{rain:4,blossom:4,clear:2}},
  {n:'summer',m:[5,6,7],w:{clear:6,rain:2},warm:1}],
 kinds:{
  clear:{n:'Clear',line:'The sky is clear over the Silent Realm.'},
  rain:{n:'Rain',line:'Rain falls on the Silent Realm.',max:150,vy:[5,7.5],near:.7,c:['#6c7caa','#8090be','#5c6a9a'],wind:-4,splash:1,fog:1.4,thunder:[40,140]},
  snow:{n:'Snow',line:'Snow falls on the Silent Realm.',max:140,near:.8,vy:[.35,.7],c:['#c8d0ec','#dfe4f6','#aeb8dc'],sway:.5,settle:[2,4],fog:1.15},
  leaves:{n:'Falling leaves',line:'Leaves drift down across the Silent Realm.',max:60,top:4.5,vy:[.45,.8],c:['#d86a2c','#c4442a','#e8a83a','#d08a2a','#a83a1c'],sway:.9,flip:1,settle:[3,6],sp:.6},
  blossom:{n:'Blossom',line:'Blossom drifts over the Silent Realm.',max:50,top:4,vy:[.2,.35],c:['#c87898','#d890aa','#b86888','#e0a0b8'],sway:1.1,wind:.25}}};
let WXO=null,wxC=null;// the debug panel's override (this session only); the week's roll, kept for half a minute
const wxHash=s=>{let h=2166136261;for(const c of s+'|wx')h=Math.imul(h^c.charCodeAt(0),16777619);return(h>>>0)/4294967296};
// this week's roll: {k the kind, s the season}
function wxWeek(){const n=Date.now();if(wxC&&n<wxC.u)return wxC;const w=wk(n),m=new Date(w+'T12:00:00').getMonth(),s=WX.seasons.find(x=>x.m.includes(m))||WX.seasons[0],
 W=s.w,tot=Object.values(W).reduce((a,b)=>a+b,0);let r=wxHash(w)*tot,k='clear';for(const j in W)if((r-=W[j])<0){k=j;break}return wxC={k:WX.kinds[k]?k:'clear',s,w,u:n+3e4}}
// what falls now: the debug override, nothing when Settings turns it off, or the week's roll
function wxNow(){if(WXO&&WX.kinds[WXO])return WXO;if(S.set&&S.set.wx==='off')return 'clear';return wxWeek().k}
// the line for the title screen ('' on an ordinary clear week)
function wxLine(){const k=wxNow(),s=wxWeek().s;if(k==='clear')return s.cold?'The air is clear and cold over the Silent Realm.':'';return k==='rain'&&s.warm?'A warm rain falls on the Silent Realm.':WX.kinds[k].line}

/* ===== THE DAY'S CHRONICLE, TODAY'S FUNNEL AND PERSONAL BESTS =====
   A Conversation, here, is any call where you spoke to someone: Conversation, Beacon Lit, Holdfast Secured or Gargoyle
   (a rude one still answered). Only today and yesterday keep their timestamped deeds in S.ev; older days live on in
   S.days as counts and XP per deed, with no times and no gold, so anything that needs the clock (the best hour, the
   first beacon) is either read from S.ev or recorded at the moment it happens. Helpers are hoisted declarations and
   state is `var`, so render() can call in here even before this block has run; every hook into the game is wrapped. */
function isConvo(k){return k==='talk'||k==='beacon'||k==='hold'||k==='gargoyle'}

function evGold(e){return(e.g|0)+(e.r||[]).reduce((a,r)=>a+(r==='j'?50:r[0]==='q'?20:r[0]==='b'?100:r[0]==='w'?50:r[0]==='g'?(+r.slice(1)||0):0),0)}

function gearDebug(a){if(!CYCLE.debug||S.cls==null)return;
 if(a==='mig'){S.inv=[0,5,10,13,18,7];S.eq=[1,6,null,15,19];S.up={0:3,6:2,15:1};delete S.gi;delete S.ge;delete S.gu;normalize();save();render();
  return say('An old save\'s numbered gear, moved across: '+eqp().filter(x=>x).map(id=>GX[id].name+(up()[id]?' +'+up()[id]:'')).join(', ')+' worn; '+inv().length+' in the pack.',true)}
 if(a==='chest'){S.chests=(S.chests|0)+5;save();render();return say('+5 Loot Chests (debug).')}
 if(a==='all'){GEAR.forEach(g=>{if(!owned(g.id))inv().push(g.id)});save();render();return say('Every item is in your pack (debug).')}}
// the merchant's item, chosen the first time its deal is shown (one the player does not own yet, when there is one)
function rvGear(R,D){const r=D.item|0;if(!R.gi||!GX[R.gi]||GX[R.gi].rarity!==r)R.gi=gRand(r,1);return GX[R.gi]}
/* ===== APPEARANCE (v42): in the Hero and Gear tabs, for the head, armour and weapon, whether the hero wears the equipped
   item or their own outfit (S.app; the gear's bonuses count either way). The debug panel's Level row. ===== */
function appView(){const A=S.app||{},E=eqp();
 return '<div class="ap"><div class="qs-sub ap-h">Appearance</div>'+[['head','Head',0],['armor','Armor',3],['weapon','Weapon',1]].map(([k,l,i])=>{const g=A[k]!=='outfit',it=E[i]&&GX[E[i]];
  return '<div class="ap-r"><span class="ap-l"><b>'+l+'</b><span class="mute">'+(it?it.name:'Nothing equipped')+'</span></span><span class="ap-t" role="group" aria-label="'+l+': how it looks">'
   +'<button type="button" class="mini'+(g?' on':'')+'" data-a="A'+k+':gear" aria-pressed="'+g+'">Show gear</button><button type="button" class="mini'+(g?'':' on')+'" data-a="A'+k+':outfit" aria-pressed="'+!g+'">Show my outfit</button></span></div>'}).join('')
  +'<div class="mute ap-n">Gear bonuses count either way: this is only how your hero looks.</div></div>'}
// the debug panel's Level row: up a level (as a real level-up, with its messages), back a level, or 10 XP short of the
// companions' level (bonus XP only: a save whose deeds alone are past it cannot go back)
function lvDebug(a){if(!CYCLE.debug||S.cls==null)return;const need=L=>{let x=0;for(let k=1;k<L;k++)x+=250+50*k;return x},base=total()-(S.bxp|0),L=lvl(total()).L;
 if(a==='+'){rvXP(need(L+1)-total());save();render();return}
 const t=a==='-'?need(Math.max(1,L-1)):need(PET.unlock)-10,b=t-base;if(b<0)return say('Your deeds alone are past that (debug).');
 S.bxp=b;save();render();say('Level '+lvl(total()).L+', '+lvl(total()).n+' XP into it (debug).')}
/* ===== WEEKLY FOES (v43): six foes take turns, and each week's HP is sized to the player. S.bw holds this week's foe, fixed the
   first time the week is seen: {w: the week's Monday, hp, i: which foe in B, o: 1 for a save's first week in v43 (it keeps the
   old rules: its foe and 1500 HP), dx: debug damage}. ===== */
// the player's average day over their last 10 workdays with deeds, before today: XP, dials, parley points (Conversation 1,
// Beacon and Holdfast 2), objections and valor (Conversation 1, Beacon 6, Holdfast 15); n: how many such days there were
function dayAvg(){const X={},N={},td=day(Date.now()),gc=S.gcut?day(S.gcut):'~',cn=(d,k,v)=>{const c=N[d]=N[d]||{};c[k]=(c[k]|0)+v};
 (S.ev||[]).forEach(e=>{const d=day(e.t);if(d>=td)return;X[d]=(X[d]||0)+e.x;cn(d,e.k,1);if(isDial(e.k,e.t))cn(d,'$d',1)});
 Object.entries(S.days||{}).forEach(([d,o])=>{if(d>=td||!o)return;for(const k in o.x)X[d]=(X[d]||0)+(+o.x[k]||0);for(const k in o.n){cn(d,k,o.n[k]|0);if(k!=='obj'&&k!=='article'&&!(k==='gate'&&d>gc))cn(d,'$d',o.n[k]|0)}});
 const L=Object.keys(X).filter(d=>X[d]>0&&new Date(d+'T12:00:00').getDay()%6!==0).sort().slice(-10),n=L.length,av=f=>n?L.reduce((a,d)=>a+f(N[d]||{},X[d]),0)/n:0;
 return{n,xp:av((c,x)=>x),dl:av(c=>c.$d|0),pa:av(c=>(c.talk|0)+2*((c.beacon|0)+(c.hold|0))),ob:av(c=>c.obj|0),va:av(c=>(c.talk|0)+6*(c.beacon|0)+15*(c.hold|0))}}
// this week's foe: 4x the player's average day of XP (500 to 6000, to the nearest 50; 1200 until they have 3 such days), less if
// the week is first seen after Monday (by the workdays left); the six take turns, never the same foe two weeks running
function bossWeek(){const w=wk(Date.now());let F=S.bw;if(F&&F.w===w&&B[F.i]&&F.hp>0)return F;
 const n=Math.floor(new Date(w+'T12:00:00')/6048e5);let i=n%B.length,hp,o=0;
 if(!F&&(S.ev.length||Object.keys(S.days||{}).length||S.old)){i=n%3;hp=HP;o=1}
 else{if(F&&F.i===i)i=(i+1)%B.length;const A=dayAvg(),d=new Date().getDay(),left=d===0||d===6?1:6-d;
  hp=Math.max(500,Math.min(6000,Math.round((A.n<3?1200:4*A.xp)*left/5/50)*50))}
 F=S.bw={w,hp,i};if(o)F.o=1;try{save()}catch(e){}return F}
/* ===== THE WORLD MAP, continued (v43): the Mistmoor Fens, Ashen Pass and the Abyss of Dissonance follow the Citadel; then the
   Long Road, stretch after stretch of seven nodes whose targets come from the player's own recent days, so a stretch takes about
   two weeks at any pace. mapState.lap: the stretch (from 0); mapState.lg: its nodes' [target, XP, gold]. ===== */
// (var, not const: the map reads them while the page is still loading, when they are simply not there yet)
var LRN=['L1','L2','L3','L4','L5','L6','L7'],LRP=null;
// a stretch: each node a set number of the player's average days (dials, objections, parley points, rest, dials, parley points,
// valor); XP about three quarters of an average day along one path; 400 gold along one path
function lrCalc(){const A=dayAvg(),ok=A.n>=3,r=(v,s,m)=>Math.max(m,Math.round(v/s)*s),D=ok?A.dl:75,P=ok?A.pa:12,O=ok?A.ob:5,V=ok?A.va:16,X=ok?A.xp:450;
 const T=[r(D*1.4,5,60),r(O*1.6,1,6),r(P*1.2,1,6),5,r(D*1.8,5,80),r(P*1.6,1,8),r(V*4.5,5,40)],F=[.1,.1,.1,.05,.12,.12,.4],G=[40,50,50,20,60,60,230],o={};
 LRN.forEach((id,j)=>o[id]=[T[j],Math.max(20,Math.round(X*F[j]/10)*10),G[j]]);return o}
// before the Long Road is reached, its chart previews targets worked out from the player's days (once a day)
function lrApply(M){if(!LRN)return;const td=day(Date.now()),G=M.lg&&typeof M.lg==='object'?M.lg:(LRP&&LRP.d===td?LRP.g:(LRP={d:td,g:lrCalc()}).g);
 LRN.forEach(id=>{const v=G[id];if(Array.isArray(v)&&v.every(x=>x>0)&&NB[id]){NB[id].goal=v[0];NB[id].xp=v[1];NB[id].g=v[2]}})}
function lrStart(M){M.lg=lrCalc();lrApply(M)}
// the stretch's last reward claimed: the next stretch begins with fresh nodes and new targets (and its own chart)
function lrNext(M){M.lap=(M.lap|0)+1;M.clearedNodes=M.clearedNodes.filter(i=>!LRN.includes(i));M.unlockedNodes=M.unlockedNodes.filter(i=>!LRN.includes(i)).concat('L1');
 M.queue=M.queue.filter(i=>!LRN.includes(i));LRN.forEach(i=>delete M.nodeProgress[i]);lrStart(M);
 if(!NB[M.currentNodeId]||LRN.includes(M.currentNodeId)||M.clearedNodes.includes(M.currentNodeId)){M.currentNodeId='L1';M.currentBiome='long';applySkin()}
 say('Stretch '+(M.lap+1)+' of the Long Road begins.',true)}
// a new sector's last node gives an item new to the player too: an Epic (the Fens, Ashen Pass, most Long Road stretches) or a
// Legendary (the Abyss, every third stretch); if they own every one of that rarity, half its price in gold instead
function BU(id){return id==='y7'?3:id==='m7'||id==='a7'?2:id==='L7'?((MS().lap|0)%3===2?3:2):0}
function mapPrize(id){const r=BU(id);if(!r)return;const it=item(gRand(r,1));if(owned(it.id)){S.gold+=it.p/2;say('Spare '+it.n+' sold for '+it.p/2+' gold')}else{inv().push(it.id);say('A prize from '+NB[id].n+': '+it.n+' (see Gear)',true)}}
// a save that finished the Citadel before there was more: the Fens open on the first load, announced with the next deed
function mapMore(M){if(M.clearedNodes.includes('c7')&&!M.unlockedNodes.includes('m1')&&!M.clearedNodes.includes('m1')){M.unlockedNodes.push('m1');M.nw=1;
 if(!NB[M.currentNodeId]||M.clearedNodes.includes(M.currentNodeId)){M.currentNodeId='m1';M.currentBiome='mist'}}}
function mapNews(M){if(!M.nw)return;delete M.nw;say('New lands beyond the Citadel: the Mistmoor Fens. Open the Map [W]',true);E.cel('NEW LANDS','#9fd36a')}
/* ===== the Codex rows, and the debug panel's Boss and Map rows ===== */
function foeCodex(){return 'Six foes take turns, a new one every Monday: '+B.map(b=>b[0]+' (weak to '+b[2]+')').join(', ')+'. Each week its HP is set from your own pace: four times your average day of XP over your last 10 workdays, less if your week starts late, so it falls around Thursday at any volume. With a quarter of its HP left it pays 50 gold; defeated, 100 gold and a Loot Chest.'}
function mapCodex(){const K=Object.keys(BIO).filter(k=>k!=='long');return 'Five sectors, one after another: '+K.map(k=>BIO[k].n).join(', ')+'. Choose the node you work toward: its bonus applies while it is active, and clearing it pays out. Each sector ends at a boss node with a Loot Chest; the last three also give an item new to you (an Epic, an Epic, then a Legendary). After them comes the Long Road, which never ends: stretch after stretch of seven nodes, their targets set from your own recent days so each stretch takes about two weeks.'}
function bossDebug(a){if(!CYCLE.debug||S.cls==null)return;const F=bossWeek();
 if(a==='next'){F.i=(F.i+1)%B.length;say('This week: '+B[F.i][0]+' (debug)')}else if(a==='hit'){const d=Math.round(F.hp/4);F.dx=(F.dx|0)+d;say('Debug damage: '+d+'. Log a deed for its rewards.')}
 save();render()}
function mapDebug(a){if(!CYCLE.debug||S.cls==null)return;const M=MS(),n=NB[M.currentNodeId];
 if(a==='clr'){if(!n||M.clearedNodes.includes(n.id))return say('No active node (debug).');M.nodeProgress[n.id]=n.goal;clearNode(n)}
 else if(a==='sec'){const K=Object.keys(BIO),cur=n?n.sec:M.currentBiome,nx=K[K.indexOf(cur)+1];if(!nx)return say('The Long Road is the last sector (debug).');
  Object.values(NB).filter(m=>m.sec===cur).forEach(m=>{if(!M.clearedNodes.includes(m.id))M.clearedNodes.push(m.id);if(!M.unlockedNodes.includes(m.id))M.unlockedNodes.push(m.id)});M.queue=M.queue.filter(i=>NB[i]&&NB[i].sec!==cur);
  const f=Object.values(NB).find(m=>m.sec===nx);if(!M.unlockedNodes.includes(f.id))M.unlockedNodes.push(f.id);if(nx==='long'&&!M.lg)lrStart(M);
  M.currentNodeId=f.id;M.currentBiome=nx;applySkin();say('Skipped to '+BIO[nx].n+' (debug, no rewards).')}
 save();render();mapUI()}
/* ===== THE ARCADE (v44): DialBound as the first game of the Arcade. When the Arcade's shared profile is there (its
   shared/profile.js loaded, and a profile stored), music, sound effects and reduced motion come from it on load, the
   master volume scales DialBound's own music and effect volumes, and a switch flipped here is written back, so the hall
   and the game agree. Opened on its own (no Arcade, or no profile yet), DialBound keeps its own settings, untouched.
   Its save is its own ('longroad_v1'): the Arcade never reads or writes game progress here. "Back to Arcade" leaves for
   the hall, on the title screen and in the Esc menu. ===== */
function arcadeP(){try{return window.Arcade&&Arcade.profile&&Arcade.profile.exists()?Arcade:null}catch(e){return null}}
function arcadeIn(){const A=arcadeP();if(!A)return;const s=A.profile.get().settings;
 S.mus=!!s.music;S.snd=!!s.sfx;if(S.set&&['sys','on','off'].includes(s.motion))S.set.rm=s.motion;arcadeIn.vol=s.volume;try{A.played('dialbound')}catch(e){}}
// the shared master volume (1 without the Arcade): a factor on top of DialBound's own volumes, never saved in its save
function arcVol(){return typeof arcadeIn.vol==='number'?arcadeIn.vol:1}
function arcadeOut(k,v){try{const A=arcadeP();if(A)A.settings.set(k,v)}catch(e){}}
function goArcade(){try{save()}catch(e){}location.href='../../index.html'}
try{$('#tarc').onclick=goArcade}catch(e){}
</script></body></html>
